und the white putty, baking it into glowing quartz-like pure taranium. You step out with the stolen blaster and explain you need the larger sphere to undo a threat to every timeline Goblins travel, and the Goblin sniffs that heavy ropes of fate tie the whole universe around you; she shrugs that she must decide, or toss a coin for it - heads or tails.","w":1960},"131":{"p":null,"e":[[185,"forced",""]],"en":null,"s":"You retrieve the neutronic device and reason that with the manipulator offline during the blast you can jump back before the attack: in a borrowed EVA suit you wait outside Stormcage, and when Silex's rescuers' ship arrives you pulse its systems once and watch it explode with the Boy, the Woman and everyone aboard. Back inside, you stroll past the concerned guards to Silex's cell and wish him enjoyment of his many life sentences, certain the rift will now never open.","w":1517},"132":{"p":null,"e":[],"en":"death","s":"You come to in a starship vibration, stretched out and cap-wired in Silex's machine, fever-weak from your gunshot wound. Silex dismisses your genuine plea for a doctor as one more of Professor Song's studied tricks; you lack the energy even to argue, your eyes close, and they never open again. THE END","w":1763},"133":{"p":null,"e":[[167,"choice","If you follow them"],[100,"choice","If you want to use your vortex manipulator"]],"en":null,"s":"You bolt before the isolation traps can fire, only for the alarm, the lights and the laser lemon squeezer all to die together: the prisoner has somehow killed all power in Stormcage. You rule out the Doctor - the plan has the wrong shape and no disguise could hide him from you - then hide under glamour while clay-like violet-eyed figures kill Tomax and ten more guards with ease, their prison-powered guns useless, as two more figures hurry past. You can follow them, or use your vortex manipulator.","w":3181},"134":{"p":null,"e":[[33,"choice","Will you break into the office?"],[63,"choice","Or you can choose to head for the dancers’ dressing rooms"]],"en":null,"s":"Backstage is eerily deserted after the show, but a carpeted red passage leads to an incongruous oak door with a brass plate reading MARLEY WINNERMAN - STADIUM MANAGEMENT; nobody answers your knock and the handle is locked. You can break into the office, or head for the dancers' dressing rooms instead.","w":651},"135":{"p":null,"e":[[56,"choice","If you talked to the two women in the tavern"],[123,"choice","If you did not talk to the two women but only spoke to the man with the eyepatch"]],"en":null,"s":"You edge around the fast-time zone and study the entrance through the illusion: the tomb doors are really composite plascrete doubles, and set into the wall to their left is a numerical keypad. If you spoke to the two women in the tavern you have their whispered clue for the code; if you only spoke to the eyepatch man, you must look for another way in.","w":327},"136":{"p":null,"e":[[177,"forced",""]],"en":null,"s":"You coax the Dalek shields online just as the missiles detonate outside, and the affronted ship triggers an emergency temporal shift, dumping you back into the vortex. Reaching Hennessey is now impossible, so the only plan left is to reach the Umbriel taranium facility yourself and steal enough of the rarest mineral in existence, against hideous odds - and you find yourself smiling at the thought.","w":632},"137":{"p":null,"e":[],"en":"death","s":"The Dalek databanks yield one vital find: a base algorithm that must be entered into the destructor's taranium core or the weapon cannot channel its energies at all. Your triumph dies when a deeper query triggers an electrified security alarm that hurls you across the room; the alarm screams on, but nobody alive remains to hear it. THE END","w":731},"138":{"p":null,"e":[[25,"choice","Will you go left?"],[153,"choice","Will you go right?"]],"en":null,"s":"Matter concedes the bigger treasure is worthless without a universe to enjoy it in and kicks the taranium sphere to you, keeping the little cube for herself, then scuttles off alone to her cool rowing boat as lights drone overhead. Rather than trail her toward the main exit, you eye the two passages that could lead you back to the cave and the hidden Dalek timeship: left or right.","w":1228},"139":{"p":null,"e":[[106,"choice","If so"],[142,"choice","If you think it’s time to get off this planet"]],"en":null,"s":"You bluff the lone Cyberman, declaring yourself a sole agent and threatening to trigger your wrist-worn neutronic device if it stops you leaving. It declines the gamble that its last-of-its-kind logic cannot afford, and no blast comes as you turn and run; at the end of the corridor you can slip back toward the plaza, or decide it is time to get off this planet.","w":780},"140":{"p":null,"e":[],"en":"bad","s":"Flashpin, Jasmarna's real PA and bodyguard, is unaffected by the hallucinogenic lipstick and crushes your throat until you black out. You wake inside a physical regenerator on a hospital shuttle, vortex manipulator gone, bunked beside fans injured at the concert, Jasmarna's music on endless loop as the shuttle carries you ever further from the rift you no longer have time to stop. THE END","w":1152},"141":{"p":null,"e":[[128,"choice","If you tell Silex exactly what the rift is"],[111,"choice","If you keep that information to yourself"]],"en":null,"s":"You come through the machine's aftereffects surrounded by violet-eyed strangers, the rift still gaping through the viewport: stable for the moment, but one nick in its fabric could rip through all reality, and you have no idea how to contain it while still tied up. You can tell Silex exactly what the rift really is, or keep that information to yourself.","w":1222},"142":{"p":null,"e":[[148,"forced",""]],"en":null,"s":"Unwilling to linger near the homicidal Cyberman, you decide the tattooed woman in red leather is your better lead; with your manipulator dead, you piggyback its circuits onto discarded Cyber-power connections until a crackle of charge makes it chime. The transfer grabs you before you can even strap the device to your wrist.","w":690},"143":{"p":null,"e":[[31,"forced",""]],"en":null,"s":"A portrait of the bald, tattooed-browed Marley Winnerman triggers an intra-stadium teleport pad offering virtual screens of every room, but when you select the Supporting Artistes' Dressing Room the system reports DNA match negative, roots your feet to the pad and announces that trespassers are remanded to the security wing.","w":856},"144":{"p":null,"e":[[166,"choice","If you stay back"],[62,"choice","If you catch up with yourself"]],"en":null,"s":"You talk Silex into believing a time destructor powered by taranium could erase all competing dimensions, and he frees you from the machine to find some, despite his distrust; you know the quest risks the Blinovitch Limitation Effect if another River is present. You surface in a foggy village and immediately spot a slightly bruised other you striding toward the largest hut; you can stay back and watch yourself, or catch up with yourself.","w":3639},"145":{"p":null,"e":[[40,"choice","If you try to activate the device"],[124,"choice","If you do not try to activate it"]],"en":null,"s":"You lead the Cyberman up the spiral stair to a gantry overlooking the Boy's command section, then watch it batter open an unsecured armoury of guns meant for fresh converts. On a low shelf it has overlooked sits a heavy white-plastic egg-shaped device with a track-pad, clearly not Cyber-tech and presumably the Boy's weapon; the Cyberman turns and demands you identify it. You can try to activate the device, or not.","w":1715},"146":{"p":null,"e":[],"en":"death","s":"Mavic Chen's giant spinning-top luxury craft, the Spar, boards without security - arrogance, as Hennessey notes - and he programs a round-trip system orbit before a red fuel-line warning even registers. Chen rigged the Spar to self-destruct to prove his wiliness to the Daleks; protecting established history, your deaths simply become part of it as the explosion consumes you both. THE END","w":1336},"147":{"p":null,"e":[],"en":"death","s":"You keep thinking the same thought, that taranium plays tricks with time unless securely contained and that surely the core holds enough now; the sentence repeats, overlaps and collapses in on itself until your mind loops apart with it. THE END","w":674},"148":{"p":null,"e":[[100,"choice","If you try the fast return switch on the vortex manipulator"],[154,"choice","If you explore Stormcage"]],"en":null,"s":"You materialise in sterile white Stormcage with the TARDIS coordinates wiped by the power surge, unable to tell when you are: you might meet yourself, or Silex may already have come and gone. The manipulator has a never-used fast return switch, but you can also explore the prison first.","w":590},"149":{"p":"Who are you?","e":[[12,"choice","If you introduce yourself as a songwriter"],[39,"choice","If you introduce yourself as the owner of the venue"],[140,"choice","If you introduce yourself as Jasmarna’s new PA"]],"en":null,"s":"You land in Jasmarna's flower-draped dressing room, where a screen shows her performing to hundreds of thousands amid dancers dressed as scientists, and a crossed-out tour calendar gives the next concert in two days at coordinates ten-zero-thirteen-twenty. A beetroot-jelly assistant called Flashpin catches you and demands who you are; with hallucinogenic lipstick already applied, you introduce yourself as a songwriter, as the owner of the venue, or as Jasmarna's new PA.","w":2040},"150":{"p":null,"e":[[165,"forced",""]],"en":null,"s":"You trade barbs with Silex until he spells out his endgame: combining his power to spawn through the conflux with your artron-saturated genetics would turbo-charge the seeding until every world everywhere becomes Tgalin, and his only answer to your refusal is that you have no choice in the matter.","w":1925},"151":{"p":null,"e":[],"en":"bad","s":"You leave the Boy dead and walk out into the sunlit square where the violet-eyed acolytes wait passively like cattle; at your order the Cyberman begins full conversion, restoring the surgical bays to factory settings while the last screaming fragment of River Song fades to static. In the whine of saws you watch contentedly, knowing the planet will be perfect. THE END","w":822},"152":{"p":null,"e":[[65,"choice","Do you go to investigate what’s coming?"],[120,"choice","Do you hide out of sight till it’s passed?"]],"en":null,"s":"In the sweltering Kembel jungle of 4000, swathed against Varga thorns whose scratch turns victims homicidal then mutates them into plants, you explain to Hennessey that the manipulator homes in on local space-time disturbances like alien bases. When something large moves through the nearby undergrowth, you can go and investigate it, or hide out of sight until it passes.","w":1391},"153":{"p":null,"e":[[77,"choice","Do you risk adding some more taranium?"],[147,"choice","Do you leave the core half-filled?"]],"en":null,"s":"You reach the cave and the Dalek timeship as military spacecraft begin the sighting runs ahead of the neutronic bombardment, and examine the burnt-out destructor: a scoop built into the false eyeball lets you load taranium into the empty core. Half of it restores the silver cylinder as if new while the rest of the machine stays scorched and twisted. You can risk adding more taranium, or leave the core half-filled.","w":1324},"154":{"p":null,"e":[[100,"choice","If you tap it once"],[98,"choice","If you press and hold it"]],"en":null,"s":"You slip back to your cell and see yourself asleep on the bunk, with no way of knowing which moment of your incarceration you have landed in; unwilling to wait for events to repeat, your only option is the fast return switch, which you can tap once or press and hold.","w":315},"155":{"p":null,"e":[[92,"forced",""]],"en":null,"s":"Flashpin blocks the stage exit and swells to twice her size, flinging Hennessey aside and swatting you flat with a growled mic drop. Jasmarna pronounces you her guest for the rest of the tour until the conflux template is ready, notes that Hennessey will need replacing as a dancer, and crouches over you with a cold smile: the true Song is yet to be sung.","w":916},"156":{"p":null,"e":[[42,"choice","If you wait for the prisoner to regain consciousness"],[174,"choice","If you leave"]],"en":null,"s":"You refuse to help a mass murderer, and watch as he smashes a manacle into his own face until a white smuggled implant disguised as a molar tinkles to the floor, then slumps exhausted just short of it. The object lies glinting beyond the reach of your arm through the bars; you can wait for him to regain consciousness, or leave.","w":1431},"157":{"p":null,"e":[[92,"forced",""]],"en":null,"s":"Following the Daleks' trails through the jungle you find their secret base behind a cliff door in a bare brown mountain, but four Daleks emerge and chase you for half an hour before cornering you in a thicket. You jump the manipulator with no time to set a course, landing back on Jasmarna's darkened stage where Flashpin swats Hennessey aside and throttles you unconscious.","w":2338},"158":{"p":null,"e":[],"en":"death","s":"The Dalek ship's demat controls respond with deliberate sluggishness, almost as if they prefer the missiles to destroy the vessel in human hands; you are still cursing them when the missiles strike and tear the laughing ship apart. THE END","w":335},"159":{"p":null,"e":[[86,"forced",""]],"en":null,"s":"The alarm leads you back to isolation, where the prisoner has collapsed in his cell; you drop the glamour, wisecrack your way past the armed guards and talk yourself inside to check his pulse. When Michenni names him Arun Navern, your hand sticks to his neck and your strength floods into him; he grabs Keisa's pistol, takes your laser tweezers to extract the tooth-device from his mouth, and squeezes it - killing every light in Stormcage instead of detonating, then shoves Keisa out, locks you in and leaves you too weak to move.","w":4679},"160":{"p":null,"e":[[72,"choice","If you head back to the new prisoner’s cell"],[100,"choice","If you use your vortex manipulator"]],"en":null,"s":"You shield the prone Tomax with your protective gear through the countdown, and open your eyes to no green field and no light at all: the power has failed completely, likely saving you both. You leave the gear with the unconscious Tomax, and the silence gives you a choice between investigating back at the new prisoner's cell and trying the vortex manipulator, which may finally work with the prison powered down.","w":1755},"161":{"p":null,"e":[[183,"forced",""]],"en":null,"s":"The vortex manipulator refuses to respond to shaking, urging or blows. The Cyberman's hand slams onto your shoulder, its shot tears through your stomach, and as the dark closes in you know its promise that you shall be like us is perfectly correct.","w":384},"162":{"p":null,"e":[],"en":"death","s":"You lunge for the closet door but the mirrored walls hide no handle you can find; Zelna's reflection raises the tiny gun, the burn hits you in the back, and you are dead before your cheek finishes sliding down the cold glass. THE END","w":357},"163":{"p":null,"e":[[151,"forced",""]],"en":null,"s":"Your thoughts now precise and linear, you fight beside the Cyberman through the circular doors and gun down the Boy's sentries with ruthless efficiency. The Boy babbles that all the acolytes are interdependent extrusions of Silex and full conversion will destroy them, but the only logic left in you is that an obstruction must be removed; your charged hand closes around his throat and his body goes limp.","w":2401},"164":{"p":null,"e":[[96,"choice","If you go to Jasmarna’s concert"],[181,"choice","If you go to Navern’s capture"]],"en":null,"s":"You fit the Dalek ship inside your cell while the rift's temporal ripples build outside and find the prison full of dead guards and shot prisoners; a surviving vraxoin dealer named Giffen has already betrayed your return for leniency. Trapped at the cell gate as Silex's group catches up, you dive for the ship when the sight of it panics him, and overhear him rage that he killed Navern and was arrested in his place. That gives you two plays: go to Jasmarna's next concert for the snip-in-time, or go to Navern's capture and deal with Silex first.","w":3444},"165":{"p":null,"e":[[141,"forced",""]],"en":null,"s":"Silex pulls the lever and you become the pebble dropped into reality: a million pathways and Rivers explode through you, and you understand that your artron energy is steeped in void stuff, so his conflux has opened not a million times but a million competing realities that will split the universe apart. Restoring one primary reality is the only answer, and you must accept that the single River Song who remains when it is done may not be you.","w":2039},"166":{"p":null,"e":[],"en":"death","s":"You watch your other self enter the large hut and then notice the fog creeping into your own hand; this dimension already contains one River and will not sustain two, and you grow misty and insubstantial until you melt away entirely. THE END","w":347},"167":{"p":null,"e":[[29,"choice","If you surrender"],[10,"choice","If you use your vortex manipulator"],[15,"choice","If you try to run"]],"en":null,"s":"You spy on something like worship: five violet-eyed figures kneel outside not-Navern's cell and touch his hands, solidifying from lumpy shapes into five mismatched humans as his strength returns, and their leader addresses him as Silex while ordering the hunt for you. Your glamour wears off at the worst possible moment and five weapons swing onto you; you can surrender, use your vortex manipulator, or try to run.","w":2048},"168":{"p":null,"e":[[172,"forced",""]],"en":null,"s":"You lift the winking circuit board from its foam and it spits a green spark, making you drop it; the discharge is just enough to reboot your dead vortex manipulator, which flickers back to life on your wrist as you press on toward the complex, glad a quick exit may be available.","w":530},"169":{"p":null,"e":[],"en":"death","s":"Stormcage's protections force you to land at the Visitors' Car Park, and guards escort you not to the governor but, electrastunned and fully aware, back to your own cell in an earlier period. They shove you through the dark door onto its occupant, and you barely register the mass of auburn curls before the Blinovitch Limitation Effect proves itself with an explosion. THE END","w":1905},"170":{"p":null,"e":[[4,"choice","If you retreat intending to return to your cell"],[103,"choice","If you stay to talk to the prisoner"]],"en":null,"s":"You steal chocolates from the governor's stores and reach isolation while the security measures are still disabled, watching the shackled, hooded prisoner installed in his cell. Once the guards leave you call him over and pull off the hood, meeting the most extraordinary deep violet eyes, which look back with a self-satisfied snake's recognition; your laser tweezers are already in hand for the lock, but you hesitate. You can retreat toward your cell, or stay and talk to the prisoner.","w":2097},"171":{"p":null,"e":[[22,"choice","If you try to rendezvous with Hennessey"],[177,"choice","If you head for Umbriel and the taranium facility there"]],"en":null,"s":"You step out into a cold desert that was Kembel jungle, the planet's present dragged into its ancient ice age amid shattered Dalek casings and dead mutant embryos; after hours of searching you find the rusted, empty-cored corpse of the time destructor and no way to repair it alone. Experts and taranium come first, so you can try to rendezvous with Hennessey, or head straight for the Umbriel taranium facility.","w":1090},"172":{"p":null,"e":[[64,"choice","Will you enter into partnership with the Cyberman?"],[139,"choice","Will you tell the Cyberman, ‘No deal’?"],[161,"choice","Will you try your vortex manipulator?"]],"en":null,"s":"In the looted conversion complex a genuine, seamless Cyberman steps from the shadows and proposes alliance: the Boy stole its conversion nodes and detonated a level-two neutronic pulse that disabled every unit, and the Cyberman wants the technology and the device back, noting the Boy wants you alive. Accepting makes you bait with useful muscle, refusing means deletion, and your rebooted manipulator offers a third way out.","w":4095},"173":{"p":null,"e":[],"en":"bad","s":"You floor the first snarling drunk with a kick and, as phantom bandits and sellswords crowd the commissary, Denton fights shoulder to shoulder with you in a glorious adventure that never ends - while the psych-tech AI watches dispassionately, already scheduling the extraction squad that will ship the latest happy thieves to life on Desperus. THE END","w":1418},"174":{"p":null,"e":[[122,"choice","If you return to your cell"],[21,"choice","If you knock out Tomax and take his protective gear"]],"en":null,"s":"You find Tomax, convince him to trigger a full alarm and two-minute lockdown, and on turning away are struck by a key mismatch: the prisoner's eyes were grey, not violet, so he may not be Arun Navern at all. The safe choice is returning to your cell before lockdown; Tomax's protective gear would instead let you brave the field and investigate.","w":2081},"175":{"p":null,"e":[[110,"choice","If you grab the stand for support"],[115,"choice","If you try to run"]],"en":null,"s":"You try to draw Jasmarna out with girl-talk about her connection to Silex, but she answers only I will sing; her glowing tattoos unleash a hissing wave of sound that bowls Hennessey over writhing and sends you staggering backwards into the microphone stand. You can grab the stand for support, or try to run.","w":537},"176":{"p":null,"e":[[163,"choice","Will you go with the Cyberman at once?"],[119,"choice","Will you study the vortex manipulator more closely?"]],"en":null,"s":"The conversion is partial and brutal: steel encases your stomach, silver filigree traces your cheekbones, an augmented hand answers your commands, and a screaming human fragment somewhere deep inside cannot make itself heard. The Cyberman hands you the gun that nearly killed you and orders you to accompany it; dim unwanted memories of your vortex manipulator linger as you choose between following at once or studying the device more closely.","w":1268},"177":{"p":null,"e":[[121,"choice","To talk to the two women"],[67,"choice","To talk to the man"]],"en":null,"s":"The Dalek ship lands unseen in a cave on Umbriel, but outside there is no terraformed refinery world - only fog, low hills and four primitive timber buildings, suggesting a bad landing in time. The larger hut is a rough tavern where the barman wordlessly serves a rationed meal, and your only fellow drinkers are two glazed women in scuffed flight suits and a sketchy man in black with an eyepatch. You can talk to the two women, or talk to the man.","w":2642},"178":{"p":null,"e":[],"en":"death","s":"You sprint down the right-hand passage into a roof collapse of cables and girders, scramble back to try the left instead, and take an energy blast to the back of the head before you clear the junction; you die in the sheet metal without ever knowing what fired. THE END","w":635},"179":{"p":null,"e":[[59,"forced",""]],"en":null,"s":"Not-Navern leaves you too weak to crawl out of the cell, then returns with five mismatched violet-eyed humans; one of the women, holding a hypodermic syringe, confirms you are the target they came for and kneels at your side to press the needle to your neck.","w":566},"180":{"p":null,"e":[[149,"forced",""]],"en":null,"s":"Your manipulator holds enough charge from the faulty circuit to tear you away from this world and its fate: the Cyberman has sniped the Boy and now has hundreds of helpless acolytes to convert, while you never learned what Silex wanted them for. The planet fades as the vortex tugs you toward your next pair of violet eyes.","w":706},"181":{"p":null,"e":[[118,"forced",""]],"en":null,"s":"This older, dull-grey-eyed Arun Navern is the soulless destroyer you remember, so you confront him at gunpoint with a pizza-delivery one-liner; when armed Silex bursts in you shoot Navern in the leg and Silex in the arm, deliver a cathartic, forensic verdict on both of them and the million dead of Beglyn 7, and activate the time destructor to unravel both their timelines, unmaking them as if they were never born.","w":2390},"182":{"p":null,"e":[[157,"forced",""]],"en":null,"s":"You find the TARDIS in a jungle clearing, but this younger Doctor has no spare key hidden above the door and the lock shows recent tampering; pleading, caressing, clicking your fingers and brute force all fail, for this TARDIS does not know you and will not accept the paradox. Hennessey drags you back toward the city and the Dalek base, warning that the destructor's field will age the area to dust if you linger.","w":1805},"183":{"p":null,"e":[],"en":"bad","s":"You wake on a filthy, oil-spattered gurney with no pain, no weakness and no memory of whoever you were before. Bolstered with metal and plastic, precise and logical, you lie in the dark and wait for orders, ready to serve the Cyber-race you now belong to. THE END","w":442},"184":{"p":null,"e":[[2,"choice","If you venture into the cave"],[93,"choice","If you decide to climb the hill path"]],"en":null,"s":"You lower yourself into the kayak, paddle hard around the foamy river bend, and slow to find the same gnarled olive tree you set out from: the river has looped you back to the becalmed inlet. Before you is the dark cave mouth with its trickling stream, and above it the scrubby mossy path climbing the hill; you can venture into the cave, or climb the hill path.","w":1508},"185":{"p":null,"e":[],"en":"good","s":"Days after you saved the universe you lie smiling in your cell, and at last the wheezing, grinding sound fills the air while the alarms become a victory fanfare and the blue box whispers into reality. Whatever face appears in those doors and whatever vintage champagne they bring, your reward has arrived - and if saving the universe is the price of the Doctor coming for you, you will pay it as many times as it takes. THE END - congratulations: your mission has been successfully completed, and undeniably a River runs through you.","w":1060}}};

</script>
<script>
/* Story tree layout - pure functions (no DOM, no SVG).
 *
 * Computes a deterministic grid layout for the personal traversal tree
 * from the player's save data. The rendering layer (4-B onward) must
 * use these coordinates without overriding parent attribution.
 *
 * Layout rules (plan section 4-A, verified 2026-10-13):
 * - Row (y) = first-arrival depth in the traversal tree (root = 0).
 * - Column (x) = deterministic order within each depth row:
 *   sort by (parent's column, section number ascending).
 * - Parent edge = the edge through which the section was first reached
 *   (from save's firstArrival map).  Rendered as SOLID.
 * - All other edges between two read sections that are NOT the tree
 *   parent edge = DASHED (convergence / jump-back).
 * - Edges from read sections to unread sections = FRONTIER (not drawn
 *   in 4-A; noted for 4-B's frontier layer).
 *
 * Save format extension (firstArrival field):
 *   The existing save {v, cur, stack, read, endings} gains a
 *   firstArrival map tracking how each section was first reached:
 *     "14": { "parent": 1, "edgeIdx": 0 }
 *   - parent: section number from which this section was first reached.
 *   - edgeIdx: 0-based index into parent's edge list.
 *   - The root section (startSection) has no entry.
 *   - firstArrival cannot be derived from read+structure alone: two
 *     different play paths can visit the same set but arrive via
 *     different parents. It must be tracked at navigation time.
 *
 * Runtime section format (as produced by build_book.py):
 *   sections["14"] = { e: [[target, kind, label], ...], en, p, s, w }
 *   e[i] = [target:int, kind:str, label:str]
 */
var ASStoryTreeLayout = (function () {
  "use strict";

  /**
   * Compute the full tree layout from save data.
   *
   * @param {Object} firstArrival - { "14": {parent:1, edgeIdx:0}, ... }
   * @param {number[]} readSet - array of all read section numbers
   * @param {Object} sections - runtime sections { "1": {e:[...], ...}, ... }
   * @param {number} startSection - root section number (usually 1)
   * @returns {Object} { nodes, dashedEdges, frontierEdges, maxDepth, maxCol }
   */
  function computeLayout(firstArrival, readSet, sections, startSection) {
    var read = {};
    for (var i = 0; i < readSet.length; i++) read[readSet[i]] = true;

    // ---- 1. Build tree from firstArrival, compute depths ----
    var depths = {};           // section -> depth
    var childrenOf = {};       // parent -> [child, child, ...]
    depths[startSection] = 0;
    childrenOf[startSection] = [];

    var secKeys = Object.keys(firstArrival);
    // Process in a way that guarantees parent depth is computed first:
    // iterate until all depths are resolved (parents are always
    // at lower depth, but firstArrival keys may not be in order).
    var pending = secKeys.slice();
    var guard = 0;
    while (pending.length && guard < secKeys.length * 4) {
      guard++;
      var nextPending = [];
      for (var pi = 0; pi < pending.length; pi++) {
        var k = pending[pi];
        var fa = firstArrival[k];
        var p = fa.parent;
        if (depths.hasOwnProperty(p)) {
          depths[k] = depths[p] + 1;
          if (!childrenOf[p]) childrenOf[p] = [];
          childrenOf[p].push(parseInt(k, 10));
          if (!childrenOf[k]) childrenOf[k] = [];
        } else {
          nextPending.push(k);
        }
      }
      pending = nextPending;
    }
    // Any sections still pending have unreachable parents (shouldn't
    // happen with valid save data, but handle gracefully).
    for (var ri = 0; ri < pending.length; ri++) {
      depths[pending[ri]] = 0;
      if (!childrenOf[pending[ri]]) childrenOf[pending[ri]] = [];
    }

    // ---- 2. Compute columns (layer order) ----
    // Group by depth, sort within each depth by (parent's column,
    // section number), assign column 0, 1, 2, ...
    var byDepth = {};
    var maxDepth = 0;
    for (var s in depths) {
      if (!depths.hasOwnProperty(s)) continue;
      var d = depths[s];
      if (d > maxDepth) maxDepth = d;
      if (!byDepth[d]) byDepth[d] = [];
      byDepth[d].push(parseInt(s, 10));
    }

    var columns = {};   // section -> column index
    var maxCol = 0;
    for (d = 0; d <= maxDepth; d++) {
      var row = byDepth[d] || [];
      row.sort(function (a, b) {
        // Sort by parent's column, then by section number.
        var pa = firstArrival[String(a)];
        var pb = firstArrival[String(b)];
        var ca = pa ? (columns[pa.parent] || 0) : 0;
        var cb = pb ? (columns[pb.parent] || 0) : 0;
        if (ca !== cb) return ca - cb;
        return a - b;
      });
      for (var ci = 0; ci < row.length; ci++) {
        columns[row[ci]] = ci;
        if (ci > maxCol) maxCol = ci;
      }
    }

    // ---- 3. Edge classification ----
    var nodes = {};
    var dashedEdges = [];
    var frontierEdges = [];

    // Root node
    nodes[startSection] = {
      row: 0,
      col: columns[startSection] || 0,
      parent: null,
      edgeIdx: null,
      edgeKind: null,
      edgeType: "root"
    };

    // Build a lookup: for each section, which (parent, edgeIdx) is the
    // solid (tree parent) edge.
    var solidEdge = {};  // "to:edgeIdx" -> true  (keyed by target section
                         //                          and the edge index in parent)
    for (s in firstArrival) {
      if (!firstArrival.hasOwnProperty(s)) continue;
      fa = firstArrival[s];
      // The solid edge is: from fa.parent, edge index fa.edgeIdx,
      //   target = parseInt(s)
      solidEdge[fa.parent + ":" + fa.edgeIdx] = parseInt(s, 10);
      nodes[s] = {
        row: depths[s],
        col: columns[s] || 0,
        parent: fa.parent,
        edgeIdx: fa.edgeIdx,
        edgeKind: null,   // filled below
        edgeType: "solid"
      };
    }

    // Fill edgeKind for solid edges by looking up parent's edge list.
    for (s in firstArrival) {
      if (!firstArrival.hasOwnProperty(s)) continue;
      fa = firstArrival[s];
      var pSec = sections[String(fa.parent)];
      if (pSec && pSec.e && pSec.e[fa.edgeIdx]) {
        nodes[s].edgeKind = pSec.e[fa.edgeIdx][1]; // kind
      }
    }

    // Scan all edges from all read sections to classify dashed/frontier.
    var readArr = Object.keys(read).map(Number);
    for (var ri2 = 0; ri2 < readArr.length; ri2++) {
      var from = readArr[ri2];
      var sec = sections[String(from)];
      if (!sec || !sec.e) continue;
      for (var ei = 0; ei < sec.e.length; ei++) {
        var edge = sec.e[ei];
        var target = edge[0];
        var kind = edge[1];
        var label = edge[2];

        // Is this the solid (tree parent) edge for this target?
        if (solidEdge[from + ":" + ei] === target) continue;

        if (read[target]) {
          // Both endpoints are read, but this is not the tree parent
          // edge -> dashed (convergence / jump-back).
          dashedEdges.push({
            from: from,
            to: target,
            kind: kind,
            label: label

        } else {
          // Target not yet read -> frontier.
          frontierEdges.push({
            from: from,
            to: target,
            kind: kind,
            label: label
          });

      }
    }

    // Sort dashed edges for deterministic output.
    dashedEdges.sort(function (a, b) {
      if (a.from !== b.from) return a.from - b.from;
      return a.to - b.to;
    });
    frontierEdges.sort(function (a, b) {
      if (a.from !== b.from) return a.from - b.from;
      return a.to - b.to;
    });

      nodes: nodes,
      dashedEdges: dashedEdges,
      frontierEdges: frontierEdges,
      maxDepth: maxDepth,

  /**
   * Build a text verification table from layout output.
   * Each line: section | depth | col | parent | edgeKind | edgeType

    lines.push("=== NODE LAYOUT (section | depth | col | parent | edgeKind | edgeType) ===");
    var secs = Object.keys(layout.nodes).map(Number).sort(function (a, b) {

        String(secs[i]).padStart(3, "0") + " | " +
        String(n.row).padStart(3, " ") + " | " +
        String(n.col).padStart(3, " ") + " | " +
        pStr + " | " +
        kStr.padEnd(8, " ") + " | " +
        n.edgeType

    lines.push("");
    lines.push("=== DASHED EDGES (convergence / jump-back) ===");
    lines.push("from -> to | kind | label (truncated)");
    var de = layout.dashedEdges;
    for (i = 0; i < de.length; i++) {
      var lbl = de[i].label || "";
      if (lbl.length > 50) lbl = lbl.substring(0, 50) + "...";
      lines.push(
        String(de[i].from).padStart(3, "0") + " -> " +
        String(de[i].to).padStart(3, "0") + " | " +
        de[i].kind.padEnd(8, " ") + " | " +
        lbl
      );
    }

    lines.push("");
    lines.push("=== FRONTIER EDGES (to unread sections) ===");
    lines.push("from -> to | kind | label (truncated)");
    var fe = layout.frontierEdges;
    for (i = 0; i < fe.length; i++) {
      var flbl = fe[i].label || "";
      if (flbl.length > 50) flbl = flbl.substring(0, 50) + "...";
      lines.push(
        String(fe[i].from).padStart(3, "0") + " -> " +
        String(fe[i].to).padStart(3, "0") + " | " +
        fe[i].kind.padEnd(8, " ") + " | " +
        flbl
      );
    }

    return lines.join("\n");

    buildVerificationTable: buildVerificationTable

/* Story tree renderer - static SVG generation (stage 4-B).
 *
 * Consumes ASStoryTreeLayout.computeLayout(...) output and produces an
 * SVG element that visualises the personal traversal tree:
 *   - lit nodes: circle + section number, solid tree-parent edges
 *   - convergence / jump-back edges: dashed lines
 *   - frontier (unread direct successors): grey locked circles, no
 *     summary, not clickable
 *
 * Stage 4-B is intentionally STATIC: no pan, zoom, centering, hovering,
 * or click-to-jump.  Those interactions arrive in 4-C and must be added
 * without changing the geometry computed here.  The SVG is sized to fit
 * all nodes with fixed grid spacing so the whole tree is visible.
 */
var ASStoryTreeRender = (function () {
  "use strict";

  var SVG_NS = "http://www.w3.org/2000/svg";
  var CELL_X = 116;   // horizontal distance between columns
  var CELL_Y = 92;    // vertical distance between depth rows
  var PAD = 64;      // outer padding
  var R = 20;        // lit node radius
  var RF = 13;       // frontier node radius

  function svgEl(tag, attrs, labelText) {
    var el = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) {
      if (attrs.hasOwnProperty(k)) el.setAttribute(k, attrs[k]);
    }
    if (labelText != null) el.textContent = labelText;
    return el;
  }

  function x(col) { return PAD + col * CELL_X; }
  function y(row) { return PAD + row * CELL_Y; }

  /**
   * Build a static story-tree SVG.
   *
   * @param {Object} layout - output of ASStoryTreeLayout.computeLayout
   * @param {Object} sections - runtime sections (for edge labels; unused
   *                            for static geometry except endings)
   * @param {number|null} current - currently open section, for highlight
   * @returns {SVGSVGElement}
   */
  function buildSVG(layout, sections, current) {
    var nodes = layout.nodes;

    // Frontier nodes: unique unread targets of frontier edges.  They sit
    // one row below their (lit) source, placed in columns just past the
    // last lit column of that row.
    var frontier = {};   // target -> {row, col}
    var frontierFrom = {}; // target -> source (lit)
    layout.frontierEdges.forEach(function (e) {
      if (frontier.hasOwnProperty(e.to)) return;
      var srcNode = nodes[String(e.from)];
      if (!srcNode) return;
      frontier[e.to] = { row: srcNode.row + 1, col: null };
      frontierFrom[e.to] = e.from;
    });

    // Assign frontier columns deterministically: group by their display
    // row, order by source section then target section.
    var byRow = {};
    Object.keys(frontier).map(Number).sort(function (a, b) {
      var fa = frontierFrom[a], fb = frontierFrom[b];
      if (fa !== fb) return fa - fb;
      return a - b;
    }).forEach(function (t) {
      var r = frontier[t].row;
      if (!byRow[r]) byRow[r] = [];
      byRow[r].push(t);
    });
    Object.keys(byRow).forEach(function (r) {
      byRow[r].forEach(function (t, i) {
        frontier[t].col = i;
      });
    });

    // Overall drawing extents.
    var maxRow = layout.maxDepth;
    var maxCol = layout.maxCol;
    Object.keys(frontier).forEach(function (t) {
      if (frontier[t].row > maxRow) maxRow = frontier[t].row;
    });

    var width = PAD * 2 + Math.max(maxCol, 0) * CELL_X +
                (frontierHasAny(byRow) ? CELL_X : 0);
    var height = PAD * 2 + maxRow * CELL_Y;

    var svg = svgEl("svg", {
      "class": "storytree-svg",
      "viewBox": "0 0 " + Math.max(width, 320) + " " +
                 Math.max(height, 240),
      "xmlns": SVG_NS,
      "role": "img",
      "aria-label": "Your story tree so far"
    });

    // Background marker group (subtle grid dots).
    var bg = svgEl("g", { "class": "st-bg" });
    svg.appendChild(bg);

    // ---- edges first (under nodes) ----
    var edgeGroup = svgEl("g", { "class": "st-edges" });
    svg.appendChild(edgeGroup);

    // Solid parent edges: from parent node to child node.
    Object.keys(nodes).map(Number).forEach(function (child) {
      var n = nodes[String(child)];
      if (n.parent == null) return;
      var p = nodes[String(n.parent)];
      if (!p) return;
      edgeGroup.appendChild(svgEl("line", {
        "class": "st-edge st-edge-solid edge-kind-" + (n.edgeKind || "plain"),
        "x1": x(p.col), "y1": y(p.row),
        "x2": x(n.col), "y2": y(n.row)
      }));
    });

    // Dashed convergence / jump-back edges (lit -> lit, not parent).
    layout.dashedEdges.forEach(function (e) {
      var a = nodes[String(e.from)];
      var b = nodes[String(e.to)];
      if (!a || !b) return;
      edgeGroup.appendChild(svgEl("line", {
        "class": "st-edge st-edge-dashed edge-kind-" + (e.kind || "plain"),
        "x1": x(a.col), "y1": y(a.row),
        "x2": x(b.col), "y2": y(b.row)
      }));
    });

    // Frontier edges: lit source -> unread target (dotted, locked).
    layout.frontierEdges.forEach(function (e) {
      var a = nodes[String(e.from)];
      var ft = frontier[e.to];
      if (!a || !ft) return;
      edgeGroup.appendChild(svgEl("line", {
        "class": "st-edge st-edge-frontier edge-kind-" + (e.kind || "plain"),
        "x1": x(a.col), "y1": y(a.row),
        "x2": x(ft.col), "y2": y(ft.row)
      }));
    });

    // ---- nodes ----
    var nodeGroup = svgEl("g", { "class": "st-nodes" });
    svg.appendChild(nodeGroup);

    // Lit nodes.
    Object.keys(nodes).map(Number).sort(function (a, b) { return a - b; })
      .forEach(function (sec) {
        var n = nodes[String(sec)];
        var secData = sections[String(sec)];
        var isEnding = secData && secData.e.length === 0;
        var cls = ["st-node"];
        if (n.edgeType === "root") cls.push("st-root");
        if (sec === current) cls.push("st-current");
        if (isEnding) cls.push("st-ending");
        nodeGroup.appendChild(svgEl("circle", {
          "class": cls.join(" "),
          "cx": x(n.col), "cy": y(n.row), "r": R
        }));
        nodeGroup.appendChild(svgEl(
          "text",
          {
            "class": "st-node-label",
            "x": x(n.col), "y": y(n.row) + 1,
            "text-anchor": "middle",
            "dominant-baseline": "middle"
          },
          String(sec)
        ));
      });

    // Frontier (unread) nodes.
    Object.keys(frontier).map(Number).sort(function (a, b) { return a - b; })
      .forEach(function (sec) {
        var ft = frontier[sec];
        nodeGroup.appendChild(svgEl("circle", {
          "class": "st-node st-frontier",
          "cx": x(ft.col), "cy": y(ft.row), "r": RF
        }));
        nodeGroup.appendChild(svgEl(
          "text",
          {
            "class": "st-frontier-label",
            "x": x(ft.col), "y": y(ft.row) + 1,
            "text-anchor": "middle",
            "dominant-baseline": "middle"
          },
          String(sec)
        ));
      });

    return svg;
  }

  function frontierHasAny(byRow) {
    return Object.keys(byRow).length > 0;
  }

  return { buildSVG: buildSVG };
})();

/* AS Gamebook Reader - per-book reader runtime (shared template).
 * Data: window.BOOK_DATA (slug, meta, structure + AI summaries), and
 * optionally window.TEXT_PACK (full build) or a text pack stored in
 * localStorage. All book-specific identity comes from BOOK_DATA; this file
 * contains no hard-coded book names. All player-facing strings are English.
 *
 * Two host modes:
 *  - Standalone book package (skeleton/full HTML): BOOK_DATA is embedded in
 *    the page; on DOMContentLoaded the reader mounts itself.
 *  - Multi-book entry (as-gamebook-reader.html): the shelf calls
 *    ASReader.mount(rootEl, bookData, textPack, hooks) when a book is opened
 *    and ASReader.unmount(rootEl) when returning to the shelf. No globals
 *    from one mounted book leak into the next.
 */
(function () {
  "use strict";

  function startReader(opts) {
    // opts: { root, DATA, inlinePackSections (null unless full build),
  var DATA = opts.DATA;
  var ROOT = opts.root || document;
  var HOOKS = opts.hooks || {};
  var SLUG = DATA.slug;
  var PACK_KIND = DATA.pack_kind || (SLUG + "_text_pack");
  var SECTIONS = DATA.sections;
  var TOTAL = DATA.count;
  var TOTAL_WORDS = DATA.total_words || 0;
  var START = DATA.start;
  var ICON = DATA.icon;
  var META = DATA.meta || {};

  var SAVE_KEY = SLUG + ".save.v1";
  var PACK_KEY = SLUG + ".textpack.v1";
  var SAVE_EXPORT_NAME = SLUG + "_save.json";
  var SAVE_VERSION = 2;

  // ---------------- state ----------------
  // stack: the current play line, stack[stack.length-1] is the current section.
  // read: set of every section ever lit up (monotonic, survives new play lines).
  // endings: sections reached that are terminals.
  var state = null;
  var mode = "summary";          // "summary" | "original"
  var inlinePackSections = opts.inlinePackSections || null;
  var textPack = inlinePackSections;
  var inlinePack = !!textPack;
  var pretendDate = null;        // null | "weekday" | "weekend" (session only)
  var rollTimer = null;

  // ---------------- tiny helpers ----------------
  // querySelector works on both Document (standalone package) and an Element
  // container (multi-book entry mount); getElementById is Document-only.
  function $(id) { return ROOT.querySelector("#" + id); }
  function pad3(n) { return (n < 10 ? "00" : n < 100 ? "0" : "") + n; }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function todayKind() {
    var d = new Date().getDay();
    return (d === 0 || d === 6) ? "weekend" : "weekday";
  }
  function packAvailable() { return !!textPack; }

  function toast(msg) {
    var t = $("toast");

    t.hidden = false;

  }

  // ---------------- persistence ----------------
  function persist() {

        v: SAVE_VERSION,
        cur: state.cur,
        stack: state.stack,
        read: Object.keys(state.read).map(Number),
        endings: state.endings,
        firstArrival: state.firstArrival || {}

    } catch (e) {
      toast("Could not write the save (browser storage blocked).");
    }
  }

  function loadSave() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || (obj.v !== 1 && obj.v !== SAVE_VERSION) ||
          typeof obj.cur !== "number")
        return null;
      var read = {};
      (obj.read || []).forEach(function (n) {
        if (SECTIONS.hasOwnProperty(String(n))) read[n] = true;
      });
      if (!SECTIONS.hasOwnProperty(String(obj.cur))) return null;
      var stack = (obj.stack || [obj.cur]).filter(function (n) {
        return SECTIONS.hasOwnProperty(String(n));

      if (!stack.length) stack = [obj.cur];

      // its already-lit sections render at depth 0 (no edges) until new
      // moves attach descendants. See sanitizeFirstArrival.
      var firstArrival = sanitizeFirstArrival(obj.firstArrival || {}, read);
      return {
        cur: obj.cur,
        stack: stack,

        endings: (obj.endings || []).filter(function (n) {

  // tampered/imported save from breaking the tree layout.

      if (!read[sec]) return;
      var rec = fa[k];
      if (!rec || typeof rec.parent !== "number") return;
      if (!read[rec.parent] && rec.parent !== START) return;
      var psec = SECTIONS[String(rec.parent)];
      if (!psec || typeof rec.edgeIdx !== "number" ||
          rec.edgeIdx < 0 || rec.edgeIdx >= psec.e.length) return;
      if (psec.e[rec.edgeIdx][0] !== sec) return;
      out[sec] = { parent: rec.parent, edgeIdx: rec.edgeIdx };

  function loadStoredPack() {

    // sections over at mount time; standalone packages use localStorage.

      // tree can attribute the solid parent edge. Find the edge index.

      var psec = SECTIONS[String(from)];
      var idx = -1;

  // ---------------- rendering: screens ----------------

    $("title-progress-text").textContent = pct + "% read";
    $("title-save-note").textContent =

       packAvailable() ? "Original text pack loaded on this browser." :
       "Skeleton edition: AI summaries only.") +
      " Progress saves automatically in this browser.";
  }

  function showChapter() {
    $("title-screen").hidden = true;
    $("chapter-screen").hidden = false;

    renderChapter();
  }

  // ---------------- story tree ----------------
  function showTree() {
    renderTree();
    $("title-screen").hidden = true;
    $("chapter-screen").hidden = true;
    $("tree-screen").hidden = false;
  }

  function renderTree() {
    var canvas = $("tree-canvas");
    canvas.innerHTML = "";
    if (!window.ASStoryTreeLayout || !window.ASStoryTreeRender) {
      canvas.textContent = "Story tree is unavailable in this build.";
      return;

    var svg = window.ASStoryTreeRender.buildSVG(layout, SECTIONS, state.cur);
    canvas.appendChild(svg);

    $("ending-banner").hidden = !isEnding;
    $("ending-actions").hidden = !isEnding;

      bad: "Bad Ending",
      neutral: "The End",
      good: "Good Ending &mdash; Mission Complete"

    if (kinds.indexOf("dice") >= 0) { renderDice(sec, choices, note); return; }
    if (kinds.indexOf("coin") >= 0) { renderCoin(sec, choices, note); return; }

    sec.e.forEach(function (edge) {
      var target = edge[0], kind = edge[1], label = edge[2];
      if (kind === "forced") {
        choices.appendChild(choiceButton("Continue", target));
      } else if (kind === "puzzle") {
        // 056 secret door: no input box, no code shown, one confident button.
        choices.appendChild(
          choiceButton("I've worked out the number", target, "is-puzzle"));
      } else if (kind === "choice") {
        choices.appendChild(choiceButton(label, target));
      }
    });
  }

  // 034 - only the exit matching the effective date is rendered.
  function renderDate(sec, choices, note) {
    var real = todayKind();
    var effective = pretendDate || real;
    var edge = sec.e.filter(function (e) {
      return e[2].toLowerCase().indexOf(effective) >= 0;
    })[0];

    var realWord = real.charAt(0).toUpperCase() + real.slice(1);
    var pretendWord = (real === "weekday" ? "weekend" : "weekday");

    var html = "Today is a " + (pretendDate ? "<s>" + realWord + "</s> "
      : "<strong>" + realWord + "</strong> ");
    if (pretendDate) {
      html += "&mdash; you are pretending it is a <strong>" +
        pretendDate + "</strong>. ";
    } else {
      html += ". ";
    }
    note.innerHTML = html;

    var toggle = document.createElement("a");
    toggle.href = "#";
    toggle.className = "pretend-link";
    toggle.textContent = pretendDate
      ? "Use today's real date (" + real + ")"
      : "I'm pretending I'm reading on a " + pretendWord;
    toggle.style.color = "var(--gold-bright)";
    toggle.style.fontSize = ".88rem";
    toggle.addEventListener("click", function (ev) {
      ev.preventDefault();
      pretendDate = pretendDate ? null : pretendWord;
      renderChapter();
    });
    note.appendChild(document.createTextNode(" "));
    note.appendChild(toggle);

    choices.appendChild(choiceButton(edge[2], edge[0]));
  }

  // 009 - roll 1d6: 6 -> 018, anything else -> 087.
  function renderDice(sec, choices, note) {
    var win = sec.e.filter(function (e) { return e[0] === 18; })[0];
    var lose = sec.e.filter(function (e) { return e[0] === 87; })[0];

    var row = document.createElement("div");
    row.className = "randomiser";
    var rollBtn = document.createElement("button");
    rollBtn.className = "btn btn-primary";
    rollBtn.textContent = "Roll the dice";
    var out = document.createElement("span");
    out.className = "random-output";
    out.textContent = "\u2022";
    row.appendChild(rollBtn);
    row.appendChild(out);
    choices.appendChild(row);

    rollBtn.addEventListener("click", function () {
      rollBtn.disabled = true;
      out.classList.add("rolling");
      var ticks = 0;
      clearInterval(rollTimer);
      rollTimer = setInterval(function () {
        out.textContent = String(1 + Math.floor(Math.random() * 6));
        if (++ticks >= 8) {
          clearInterval(rollTimer);
          var n = 1 + Math.floor(Math.random() * 6);
          out.classList.remove("rolling");
          out.textContent = String(n);
          var dest = n === 6 ? win : lose;
          note.textContent = "You rolled a " + n + "." +
            (n === 6 ? " Lucky 6!" : "");
          setTimeout(function () { gotoSection(dest[0]); }, 850);
        }
      }, 90);
    });

    addManualDivider(choices);
    choices.appendChild(choiceButton(win[2] + " \u2014 go to " + pad3(win[0]),
      win[0]));
    choices.appendChild(choiceButton(lose[2] + " \u2014 go to " +
      pad3(lose[0]), lose[0]));
  }

  // 130 - fair coin: heads -> 091, tails -> 138.
  function renderCoin(sec, choices, note) {
    var heads = sec.e.filter(function (e) { return e[0] === 91; })[0];
    var tails = sec.e.filter(function (e) { return e[0] === 138; })[0];

    var row = document.createElement("div");
    row.className = "randomiser";
    var tossBtn = document.createElement("button");
    tossBtn.className = "btn btn-primary";
    tossBtn.textContent = "Toss the coin";
    var out = document.createElement("span");
    out.className = "random-output";
    out.textContent = "\u2022";
    row.appendChild(tossBtn);
    row.appendChild(out);
    choices.appendChild(row);

    tossBtn.addEventListener("click", function () {
      tossBtn.disabled = true;
      out.classList.add("rolling");
      var ticks = 0;
      clearInterval(rollTimer);
      rollTimer = setInterval(function () {
        out.textContent = ticks % 2 ? "H" : "T";
        if (++ticks >= 9) {
          clearInterval(rollTimer);
          var headsUp = Math.random() < 0.5;
          out.classList.remove("rolling");
          out.textContent = headsUp ? "HEADS" : "TAILS";
          var dest = headsUp ? heads : tails;
          setTimeout(function () { gotoSection(dest[0]); }, 850);
        }
      }, 90);
    });

    addManualDivider(choices);
    choices.appendChild(choiceButton("Heads \u2014 go to " + pad3(heads[0]),
      heads[0]));
    choices.appendChild(choiceButton("Tails \u2014 go to " +
      pad3(tails[0]), tails[0]));
  }

  function addManualDivider(choices) {
    var d = document.createElement("div");
    d.className = "manual-divider";
    d.textContent = "Or decide the outcome yourself:";
    choices.appendChild(d);
  }

  // ---------------- settings ----------------
  function refreshPackStatus() {
    var status = $("pack-status");
    var btnOrig = $("btn-mode-original");
    var btnSum = $("btn-mode-summary");
    if (inlinePack) {
      status.textContent = "This is the built-in full edition: every section's "
        + "original text is included. (Private build \u2014 do not share.)";
    } else if (packAvailable()) {
      status.textContent = "An original text pack is loaded in this browser.";
    } else {
      status.textContent = "No original text pack loaded. The skeleton plays "
        + "with AI summaries only.";
    }
    btnOrig.disabled = !packAvailable();
    btnSum.classList.toggle("btn-primary", mode === "summary");
    btnOrig.classList.toggle("btn-primary", mode === "original");
  }

  function setMode(m) {
    if (m === "original" && !packAvailable()) return;
    mode = m;
    refreshPackStatus();
    if (!$("chapter-screen").hidden) renderChapter();
  }

  function exportSave() {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { toast("No save to export yet."); return; }
    var blob = new Blob([raw], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = SAVE_EXPORT_NAME;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  }

  function importSave(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var msg = $("settings-message");
      try {
        var obj = JSON.parse(reader.result);
        if (!obj || (obj.v !== 1 && obj.v !== SAVE_VERSION) ||
            !SECTIONS.hasOwnProperty(String(obj.cur))) {
          throw new Error("bad version");
        }
        var readArr = obj.read || [];
        var readTmp = {};
        readArr.forEach(function (n) {
          if (SECTIONS.hasOwnProperty(String(n))) readTmp[n] = true;
        });
        var fa = sanitizeFirstArrival(obj.firstArrival || {}, readTmp);
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          v: SAVE_VERSION,
          cur: obj.cur,
          stack: obj.stack || [obj.cur],
          read: readArr,
          endings: obj.endings || [],
          firstArrival: fa
        }));
        state = loadSave() || freshState();
        msg.classList.remove("error");
        msg.textContent = "Save imported. Continuing at section " +
          pad3(state.cur) + ".";
        showTitle();
      } catch (e) {
        msg.classList.add("error");
        msg.textContent = "That file is not a valid save for this book.";
      }
    };
    reader.readAsText(file);
  }

  function importPack(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var msg = $("settings-message");
      try {
        var obj = JSON.parse(reader.result);
        if (!obj || obj.kind !== PACK_KIND || !obj.sections) {
          throw new Error("bad pack");
        }
        localStorage.setItem(PACK_KEY, JSON.stringify(obj));
        textPack = obj.sections;
        inlinePack = false;
        msg.classList.remove("error");
        msg.textContent = "Text pack loaded (" +
          Object.keys(textPack).length + " sections).";
        setMode("original");
        refreshPackStatus();
      } catch (e) {
        msg.classList.add("error");
        msg.textContent = "That file is not a valid original text pack for this book.";
      }
    };
    reader.readAsText(file);
  }

  // ---------------- wire-up ----------------
  function bind() {
    $("btn-continue").addEventListener("click", function () {
      state = loadSave() || freshState();
      showChapter();
    });
    $("btn-start").addEventListener("click", function () {
      var saved = loadSave();
      if (!saved) {
        state = freshState();
        state.read[START] = true;
        persist();
      } else {
        state = saved;            // read set is monotonic
        state.stack = [START];
        state.cur = START;
        state.read[START] = true;
        persist();
      }
      showChapter();
    });
    $("btn-settings").addEventListener("click", function () {
      $("settings-message").textContent = "";
      refreshPackStatus();
      $("settings-backdrop").hidden = false;
    });
    $("btn-settings-close").addEventListener("click", function () {
      $("settings-backdrop").hidden = true;
    });
    $("settings-backdrop").addEventListener("click", function (ev) {
      if (ev.target === this) this.hidden = true;
    });

    $("btn-undo").addEventListener("click", undo);
    $("btn-ending-undo").addEventListener("click", undo);
    $("btn-ending-restart").addEventListener("click", startNewLine);
    $("btn-tree").addEventListener("click", showTree);
    $("btn-tree-back").addEventListener("click", showChapter);
    $("btn-home").addEventListener("click", function () {
      if (HOOKS.onHome) { HOOKS.onHome(); return; }
      showTitle();
    });

    $("btn-mode").addEventListener("click", function () {
      if (!packAvailable()) return;
      setMode(mode === "summary" ? "original" : "summary");
    });
    $("btn-mode-summary").addEventListener("click", function () {
      setMode("summary");
    });
    $("btn-mode-original").addEventListener("click", function () {
      setMode("original");
    });

    $("btn-export").addEventListener("click", exportSave);
    $("file-save").addEventListener("change", function () {
      if (this.files[0]) importSave(this.files[0]);
      this.value = "";
    });
    $("file-pack").addEventListener("change", function () {
      if (this.files[0]) importPack(this.files[0]);
      this.value = "";
    });
    $("btn-clear").addEventListener("click", function () {
      if (!window.confirm("Clear ALL reading progress in this browser? " +
          "This cannot be undone.")) return;
      localStorage.removeItem(SAVE_KEY);
      state = freshState();   // nothing lit, nothing persisted: true 0.00%
      var msg = $("settings-message");
      msg.classList.remove("error");
      msg.textContent = "All progress cleared.";
      showTitle();
    });
  }

  // ---------------- boot ----------------
  function renderBookIdentity() {
    var name = META.title || DATA.book || "Gamebook";
    $("title-name").textContent = name;
    if (HOOKS.setTitle) { HOOKS.setTitle(META.full_title || name); }
    else { document.title = META.full_title || name; }
    var sub = META.subtitle || "";
    $("title-sub").textContent = sub;
    var kickerParts = [];
    if (META.series) {
      kickerParts.push(META.series +
        (META.series_number ? " " + META.series_number : ""));
    }
    kickerParts.push("Interactive Gamebook");
    $("title-kicker").textContent = kickerParts.join(" \u00b7 ");
    if (META.cover) $("title-cover").src = META.cover;
    $("title-cover").hidden = !META.cover;

    // In the multi-book entry, text packs are imported at the shelf and
    // stored in IndexedDB; the in-book "Load text pack" control is hidden.
    if (HOOKS.providedPack) {
      var packLabel = ROOT.querySelector(".settings-block .file-label");
      if (packLabel) packLabel.style.display = "none";
      var note = $("pack-status");
      if (note && !packAvailable()) {
        note.textContent = "No original text pack imported for this book yet. "
          + "Import the text pack from the book's menu on the shelf.";
      }
    }
  }

  function boot() {
    loadStoredPack();
    state = loadSave();
    if (!state) {
      state = freshState(); // title offers Start New; nothing persisted yet
    }
    bind();
    renderBookIdentity();
    showTitle();
  }

  // Mount boots the title screen and returns a small handle the host uses
  // to tear the instance down (clears timers) when leaving the book.
  boot();
  return {
    showChapter: showChapter,
    unmount: function () { if (rollTimer) clearInterval(rollTimer); }
  };
  }

  // ---------------- static helpers usable without a mounted reader -------
  function makeController(opts) {
    return startReader(opts);
  }

  // Shelf progress: compute weighted read percentage + has-save + endings
  // found, directly from a save in localStorage (or an explicit save obj).
  function progressInfo(DATA, saveObj) {
    var sections = DATA.sections;
    var totalWords = DATA.total_words || 0;
    var total = DATA.count;
    var readMap = {};
    var endings = [];
    var has = false;
    var cur = null;
    if (saveObj) {
      has = true;
      cur = saveObj.cur;
      (saveObj.read || []).forEach(function (n) {
        if (sections.hasOwnProperty(String(n))) readMap[n] = true;
      });
      endings = (saveObj.endings || []).filter(function (n) {
        return sections.hasOwnProperty(String(n));
      });
    }
    var words = 0;
    Object.keys(readMap).forEach(function (k) {
      var sec = sections[k];
      if (sec && typeof sec.w === "number") words += sec.w;
    });
    var pct = totalWords > 0
      ? words / totalWords * 100
      : Object.keys(readMap).length / total * 100;
    var endingTotal = 0;
    Object.keys(sections).forEach(function (k) {
      if (!sections[k].e.length) endingTotal++;
    });
    return {
      hasSave: has, cur: cur, pct: pct,
      readCount: Object.keys(readMap).length,
      endingsFound: endings.length, endingTotal: endingTotal
    };
  }

  function readSave(slug) {
    try {
      var raw = localStorage.getItem(slug + ".save.v1");
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  window.ASReader = {
    mount: function (rootEl, DATA, inlinePackSections, hooks) {
      return makeController({
        root: rootEl, DATA: DATA,
        inlinePackSections: inlinePackSections || null,
        hooks: hooks || null
      });
    },
    progressInfo: progressInfo,
    readSave: readSave
  };

  // Standalone package self-starts only when a book payload is embedded.
  // The multi-book entry never defines window.BOOK_DATA, so this is inert
  // there even though the same reader markup exists in its DOM.
  if (window.BOOK_DATA) {
    var inline = window.TEXT_PACK && window.TEXT_PACK.sections
      ? window.TEXT_PACK.sections : null;
    var runStandalone = function () {
      makeController({
        root: document, DATA: window.BOOK_DATA,
        inlinePackSections: inline, hooks: null
      });
    };
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", runStandalone);
    } else {
      runStandalone();
    }
  }
})();

</script>
</body>
</html>
