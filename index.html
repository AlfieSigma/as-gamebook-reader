<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamebook</title>
<style>
/* Stormcage interactive - TARDIS blue theme. English UI only. */
:root {
  --tardis: #00203c;
  --tardis-deep: #001224;
  --tardis-panel: #0b2e4f;
  --tardis-line: #2a5a86;
  --gold: #c9a24a;
  --gold-bright: #e8c870;
  --text: #e9f1f8;
  --text-dim: #9fb8cc;
  --death: #d0453a;
  --bad: #e08a2e;
  --neutral: #8a97a3;
  --good: #4fae6a;
  --radius: 10px;
  --maxw: 720px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background:
    radial-gradient(1200px 600px at 50% -10%, #0a3a66 0%, transparent 60%),
    linear-gradient(180deg, var(--tardis) 0%, var(--tardis-deep) 100%);
  background-attachment: fixed;
  color: var(--text);
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size: 17px;
  line-height: 1.65;
}

#app { min-height: 100vh; }

.screen[hidden],
#title-screen[hidden],
#chapter-screen[hidden] { display: none !important; }

/* ---------------- Buttons ---------------- */
.btn {
  appearance: none;
  border: 1px solid var(--tardis-line);
  background: linear-gradient(180deg, #144a78, #0d3a61);
  color: var(--text);
  font: inherit;
  font-size: 0.95rem;
  padding: 0.62em 1.15em;
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s, transform .05s;
}
.btn:hover:not(:disabled) {
  border-color: var(--gold);
  box-shadow: 0 0 0 1px rgba(201,162,74,.35), 0 2px 10px rgba(0,0,0,.35);
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn-primary {
  border-color: var(--gold);
  background: linear-gradient(180deg, #3d6ea0, #1c4c79);
  font-weight: 600;
}
.btn-primary:hover:not(:disabled) {
  border-color: var(--gold-bright);
  box-shadow: 0 0 14px rgba(201,162,74,.4);
}
.btn-ghost {
  background: rgba(11,46,79,.55);
}
.btn-small { font-size: .82rem; padding: .4em .8em; }
.btn-danger { border-color: #8a3a34; color: #ffc9c3; }
.btn-danger:hover:not(:disabled) { border-color: var(--death); }

.file-label { display: inline-block; }

/* ---------------- Title screen ---------------- */
#title-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.title-card {
  width: min(560px, 100%);
  text-align: center;
  border: 1px solid var(--tardis-line);
  border-radius: 16px;
  padding: 44px 36px 34px;
  background:
    linear-gradient(180deg, rgba(11,46,79,.85), rgba(0,18,36,.92));
  box-shadow: 0 18px 60px rgba(0,0,0,.5), inset 0 0 60px rgba(42,90,134,.15);
}
.title-cover {
  width: 190px;
  max-width: 55%;
  height: auto;
  border-radius: 6px;
  margin: 0 auto 22px;
  display: block;
  box-shadow: 0 8px 28px rgba(0,0,0,.55), 0 0 0 1px var(--tardis-line);
}
.title-kicker {
  text-transform: uppercase;
  letter-spacing: .22em;
  font-size: .72rem;
  color: var(--text-dim);
}
.title-name {
  margin: .15em 0 0;
  font-size: clamp(2.6rem, 9vw, 4rem);
  letter-spacing: .12em;
  color: var(--gold-bright);
  text-shadow: 0 0 26px rgba(201,162,74,.35);
}
.title-sub {
  font-variant: small-caps;
  letter-spacing: .14em;
  font-size: 1.15rem;
  color: var(--text-dim);
  margin-bottom: 30px;
}
.title-progress { margin: 0 auto 26px; max-width: 360px; }
.progress-bar {
  height: 8px;
  border: 1px solid var(--tardis-line);
  border-radius: 99px;
  overflow: hidden;
  background: rgba(0,0,0,.35);
}
#title-progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--gold), var(--gold-bright));
  transition: width .3s;
}
.progress-text {
  margin-top: 6px;
  font-size: .8rem;
  color: var(--text-dim);
  letter-spacing: .08em;
}
.title-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: stretch;
  max-width: 280px;
  margin: 0 auto;
}
.title-note { margin-top: 18px; font-size: .78rem; color: var(--text-dim); }

/* ---------------- Chapter screen ---------------- */
#chapter-screen {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.chapter-topbar {
  position: relative;
  flex: 0 0 auto;
  top: auto;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--tardis-line);
  background: rgba(0,20,40,.92);
  backdrop-filter: blur(4px);
}
.chapter-no {
  font-variant: small-caps;
  letter-spacing: .18em;
  font-size: .85rem;
  color: var(--gold-bright);
}
.topbar-right { display: flex; gap: 8px; }

.chapter-body {
  width: min(var(--maxw), 100%);
  margin: 0 auto;
  padding: 26px 22px 24px;
  flex: 1;
  overflow-y: auto;
}

/* choices dock: the flex column's last item, so it stays pinned to the
   bottom-right regardless of how long the section text is; main scrolls. */
.choices-dock {
  flex: 0 0 auto;
  z-index: 6;
  display: flex;
  justify-content: center;
  padding: 12px 22px 18px;
  background: linear-gradient(180deg,
    rgba(0,18,36,0) 0%, rgba(0,16,32,.9) 40%, var(--tardis-deep) 100%);
}
.choices-dock-inner {
  width: min(var(--maxw), 100%);
  display: flex;
  flex-direction: column;
  align-items: stretch;
}
.choices-dock .choices { margin-top: 0; }
.choices-dock .ending-actions {
  justify-content: flex-end;
  margin-top: 4px;
}
.mechanic-note { margin-bottom: 4px; }
@media (max-width: 560px) {
  .choices-dock { padding: 10px 14px 14px; }
}

.prose p { margin: 0 0 1.05em; }
.prose p:last-child { margin-bottom: 0; }
.prose em { color: #ffe9c9; }

.chapter-prompt {
  margin: 26px 0 14px;
  font-variant: small-caps;
  letter-spacing: .14em;
  color: var(--gold-bright);
  font-size: 1.02rem;
}

/* ---------------- Choices ---------------- */
.choices {
  margin-top: 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.choice-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  width: 100%;
  padding: .8em 1.05em;
  font-size: .98rem;
  line-height: 1.45;
}
.choice-bullet {
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--gold);
}
.choice-label { flex: 1; }
.choice-target {
  flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
  color: var(--gold-bright);
  font-weight: 600;
  letter-spacing: .08em;
}
.choice-btn.is-puzzle { border-color: var(--gold); }

/* randomisers (dice / coin) */
.mechanic-note {
  margin-top: 20px;
  color: var(--text-dim);
  font-size: .9rem;
}
.randomiser {
  margin: 18px 0 6px;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.randomiser .random-output {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--gold-bright);
  min-width: 2.2em;
  text-align: center;
  letter-spacing: .06em;
}
.random-output.rolling { animation: rattle .12s linear infinite; }
@keyframes rattle {
  0% { transform: rotate(-8deg) scale(1.05); }
  50% { transform: rotate(7deg) scale(.96); }
  100% { transform: rotate(-8deg) scale(1.05); }
}
.manual-divider {
  margin: 14px 0 2px;
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: .18em;
  color: var(--text-dim);
}

/* ---------------- Endings ---------------- */
.ending-banner {
  margin: 26px 0 8px;
  padding: 12px 18px;
  border-radius: var(--radius);
  text-align: center;
  font-variant: small-caps;
  letter-spacing: .22em;
  font-size: 1.05rem;
  border: 1px solid;
}
.ending-banner.et-death  { color: #ffd6d2; border-color: var(--death); background: rgba(208,69,58,.14); }
.ending-banner.et-bad    { color: #ffe2c2; border-color: var(--bad);   background: rgba(224,138,46,.14); }
.ending-banner.et-neutral{ color: #d7dee5; border-color: var(--neutral);background: rgba(138,151,163,.14); }
.ending-banner.et-good   { color: #d3f3dc; border-color: var(--good);  background: rgba(79,174,106,.14); }

.ending-actions {
  margin-top: 24px;
  display: flex;
  justify-content: center;
  gap: 14px;
}

/* ---------------- Modal ---------------- */
.modal-backdrop[hidden], .toast[hidden] { display: none; }

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0,8,18,.72);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 36px 18px;
  overflow-y: auto;
}
.modal {
  width: min(520px, 100%);
  border: 1px solid var(--tardis-line);
  border-radius: 14px;
  background: linear-gradient(180deg, #0c3357, #061d34);
  padding: 24px 24px 20px;
  box-shadow: 0 20px 70px rgba(0,0,0,.6);
}
.modal h2 { margin: 0 0 12px; color: var(--gold-bright); letter-spacing: .08em; }
.settings-block {
  border-top: 1px solid rgba(42,90,134,.5);
  padding: 14px 0;
}
.settings-block h3 {
  margin: 0 0 8px;
  font-size: .82rem;
  text-transform: uppercase;
  letter-spacing: .18em;
  color: var(--text-dim);
}
.settings-note { font-size: .85rem; color: var(--text-dim); margin-bottom: 10px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.modal-close-row { justify-content: flex-end; margin-top: 14px; }
.settings-message { margin-top: 10px; font-size: .85rem; min-height: 1.2em; color: var(--gold-bright); }
.settings-message.error { color: #ff9b93; }

/* ---------------- Toast ---------------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  z-index: 30;
  padding: 10px 20px;
  border: 1px solid var(--gold);
  border-radius: 99px;
  background: rgba(6,29,52,.95);
  color: var(--text);
  font-size: .9rem;
  box-shadow: 0 6px 24px rgba(0,0,0,.5);
}

/* ---------------- Story tree ---------------- */
#tree-screen {
  display: flex;
  flex-direction: column;
  height: 100vh;
}
#tree-screen[hidden] { display: none !important; }

.tree-canvas {
  flex: 1 1 auto;
  overflow: auto;
  padding: 10px;
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(20,74,120,.35), transparent 60%);
}
.storytree-svg {
  display: block;
  min-width: 100%;
  height: auto;
}

/* edges */
.st-edge { stroke-width: 2; fill: none; }
.st-edge-solid  { stroke: #6f9cc4; }
.st-edge-dashed {
  stroke: var(--gold);
  stroke-dasharray: 6 5;
  opacity: .85;
}
.st-edge-frontier {
  stroke: #5a6b7b;
  stroke-dasharray: 2 5;
  stroke-width: 1.5;
  opacity: .8;
}
/* mechanic parent edges get a subtle gold tint on solid lines */
.st-edge-solid.edge-kind-dice,
.st-edge-solid.edge-kind-coin,
.st-edge-solid.edge-kind-date,
.st-edge-solid.edge-kind-puzzle { stroke: var(--gold-bright); }

/* lit nodes */
.st-node {
  fill: #123f66;
  stroke: #8fb6da;
  stroke-width: 2;
}
.st-node.st-root {
  fill: #1c4c79;
  stroke: var(--gold-bright);
  stroke-width: 2.5;
}
.st-node.st-current {
  stroke: var(--gold-bright);
  stroke-width: 3.5;
  filter: drop-shadow(0 0 6px rgba(232,200,112,.7));
}
.st-node.st-ending {
  fill: #1a2530;
  stroke: var(--neutral);
}
.st-node-label {
  fill: var(--text);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  user-select: none;
}

/* frontier (unread) nodes */
.st-node.st-frontier {
  fill: #0e1c2a;
  stroke: #4a5a6a;
  stroke-width: 1.5;
  stroke-dasharray: 3 3;
}
.st-frontier-label {
  fill: #6b7d8e;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  user-select: none;
}

.tree-progress-text {
  font-variant-numeric: tabular-nums;
  color: var(--gold-bright);
  font-size: .85rem;
  letter-spacing: .04em;
}

.tree-legend {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: center;
  padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid rgba(42,90,134,.5);
  background: rgba(0,18,36,.55);
  font-size: .78rem;
  color: var(--text-dim);
}
.legend-item { display: inline-flex; align-items: center; gap: 7px; }
.legend-line {
  display: inline-block;
  width: 26px;
  height: 0;
  border-top: 3px solid #6f9cc4;
}
.legend-line.legend-dashed { border-top-style: dashed; border-top-color: var(--gold); }
.legend-dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #0e1c2a;
  border: 1.5px dashed #4a5a6a;
}

/* ---------------- Phone viewport ---------------- */
@media (max-width: 560px) {
  body { font-size: 16px; }
  .chapter-body { padding: 22px 16px 50px; }
  .title-card { padding: 34px 22px 26px; }
  .chapter-topbar { padding: 8px 10px; }
  .btn-small { font-size: .78rem; padding: .38em .65em; }
  .randomiser { gap: 12px; }
  .tree-legend { gap: 10px; font-size: .72rem; }
}

</style>
</head>
<body>
<div id="app">

  <!-- ===================== Title screen ===================== -->
  <section id="title-screen" class="screen" hidden>
    <div class="title-card">
      <img id="title-cover" class="title-cover" alt="" hidden>
      <div id="title-kicker" class="title-kicker">Interactive Gamebook</div>
      <h1 id="title-name" class="title-name"></h1>
      <div id="title-sub" class="title-sub"></div>
      <div class="title-progress">
        <div class="progress-bar"><div id="title-progress-fill"></div></div>
        <div id="title-progress-text" class="progress-text">0.00% read</div>
      </div>
      <div class="title-actions">
        <button id="btn-continue" class="btn btn-primary" hidden>Continue</button>
        <button id="btn-start" class="btn btn-primary">Start New</button>
        <button id="btn-settings" class="btn btn-ghost">Settings</button>
      </div>
      <div id="title-save-note" class="title-note"></div>
    </div>
  </section>

  <!-- ===================== Chapter screen ===================== -->
  <section id="chapter-screen" class="screen" hidden>
    <header class="chapter-topbar">
      <button id="btn-undo" class="btn btn-small btn-ghost" title="Undo the last move on this play line">Undo</button>
      <div class="chapter-no">Section <span id="chapter-num">000</span></div>
      <div class="topbar-right">
        <button id="btn-tree" class="btn btn-small btn-ghost" title="View your story tree">Story Tree</button>
        <button id="btn-mode" class="btn btn-small btn-ghost" title="Switch between the AI summary and the original book text">Summary</button>
        <button id="btn-home" class="btn btn-small btn-ghost" title="Back to the title screen">Title</button>
      </div>
    </header>

    <main class="chapter-body">
      <article id="chapter-text" class="prose"></article>

      <div id="ending-banner" class="ending-banner" hidden>
        <span id="ending-banner-text"></span>
      </div>
    </main>

    <div class="choices-dock">
      <div class="choices-dock-inner">
        <div id="mechanic-note" class="mechanic-note"></div>
        <nav id="choices" class="choices"></nav>

        <div id="ending-actions" class="ending-actions" hidden>
          <button id="btn-ending-undo" class="btn btn-ghost">Undo</button>
          <button id="btn-ending-restart" class="btn btn-primary">Restart from 001</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== Story tree screen ===================== -->
  <section id="tree-screen" class="screen" hidden>
    <header class="chapter-topbar">
      <button id="btn-tree-back" class="btn btn-small btn-ghost" title="Back to reading">Back</button>
      <div class="chapter-no">Your Story Tree</div>
      <div class="topbar-right"><span id="tree-progress" class="tree-progress-text"></span></div>
    </header>
    <div id="tree-canvas" class="tree-canvas" aria-live="polite"></div>
    <div class="tree-legend">
      <span class="legend-item"><i class="legend-line legend-solid"></i> path taken</span>
      <span class="legend-item"><i class="legend-line legend-dashed"></i> rejoins an earlier section</span>
      <span class="legend-item"><i class="legend-dot"></i> section not yet reached</span>
    </div>
  </section>

  <!-- ===================== Settings modal ===================== -->
  <div id="settings-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>

      <div class="settings-block">
        <h3>Reading mode</h3>
        <div id="pack-status" class="settings-note">No original text pack loaded.</div>
        <div class="btn-row">
          <button id="btn-mode-summary" class="btn btn-small">Summary</button>
          <button id="btn-mode-original" class="btn btn-small" disabled>Original text</button>
        </div>
        <label class="btn btn-small file-label">
          Load text pack&hellip;
          <input id="file-pack" type="file" accept=".json,application/json" hidden>
        </label>
      </div>

      <div class="settings-block">
        <h3>Save</h3>
        <div class="settings-note">Progress is saved automatically in this browser, one save slot.</div>
        <div class="btn-row">
          <button id="btn-export" class="btn btn-small">Export save&hellip;</button>
          <label class="btn btn-small file-label">
            Import save&hellip;
            <input id="file-save" type="file" accept=".json,application/json" hidden>
          </label>
          <button id="btn-clear" class="btn btn-small btn-danger">Clear all progress</button>
        </div>
      </div>

      <div id="settings-message" class="settings-message"></div>

      <div class="btn-row modal-close-row">
        <button id="btn-settings-close" class="btn btn-primary">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

ce the dimensional rift to its single origin reality, and find an unconscious version of yourself wired into Silex's machine as its core - you are the rift's creator. Time-locking that other self would prevent the rift but cause a universe-ending paradox, and freeing her is impossible thanks to the Blinovitch Limitation Effect. Your remaining options are to leave and hope, or sacrifice your other self.","w":2065},"4":{"p":null,"e":[[159,"choice","If you retrace your steps to find the cause of the alarm"],[82,"choice","If you take advantage of the distraction to let yourself back into your cell unseen"]],"en":null,"s":"You leave the violet-eyed prisoner in his cell with a breezy goodbye, planning to investigate on your own terms, and get back toward your cell in nine minutes twenty-seven. Two armed guards are approaching and will see you are missing, when another alarm goes off and sends them running past you.","w":1356},"5":{"p":null,"e":[[171,"choice","To go outside"],[137,"choice","To keep checking the databanks"]],"en":null,"s":"Alone on the Dalek ship, you jump thirty-six hours into the future and check the databanks: Silex was the exiled ruler of Tgalin, who allied with the Daleks and now wants to return to his destroyed empire by any means. The ship lands on Kembel, whose surface has been hollowed out by the time destructor.","w":1886},"6":{"p":null,"e":[[165,"forced",""]],"en":null,"s":"Silex tells you that whether you understand his plan is irrelevant: you are exactly where he needs you, and you have no choice in what happens next.","w":291},"7":{"p":null,"e":[[44,"choice","If you want to try to free the Goblin"],[97,"choice","If you decide Goblins are more trouble than they’re worth"]],"en":null,"s":"Deeper in the refinery the corridors keep shifting into stone passages full of tempting ancient artefacts that you force yourself to ignore. You find a real Goblin, grey-skinned and big-eared, suspended frozen in mid-air - either a deliberate trap or someone exposed to a large quantity of taranium.","w":1153},"8":{"p":null,"e":[],"en":"death","s":"Your pistol is kicked away by a Cyberman, whose next shot peppers you with shrapnel. As it fires again the cargo ship hits warp drive: the Cyberman is reduced to slag, and you to a shadow on the ground. THE END","w":722},"9":{"p":"Roll a dice:","e":[[18,"dice","Lucky 6?"],[87,"dice","Otherwise"]],"en":null,"s":"The prisoner feigns illness, and on touching him your strength drains into him. You fire your laser tweezers to set off the alarm and break free, smashing your glamour perfume. He knocks out a fake implanted molar that cuts the power, and five faceless gunmen arrive to release him; one blocks your exit, and weak as you are you graze him with the tweezers and give away your position. You raise the tweezers for one last desperate shot - roll the dice.","w":6396},"10":{"p":null,"e":[[99,"forced",""]],"en":null,"s":"The vortex manipulator yanks you out of the vortex and you land gasping on the gravity-shielded hull of a ship beneath Stormcage, among floating bodies, with a crackling maelstrom spinning open below and dragging your haywire manipulator toward it. As a last hope you fire a pulse through the manipulator.","w":1556},"11":{"p":null,"e":[],"en":"death","s":"You run from the collapsing conversion plant, but your vortex manipulator will barely work. A shockwave downs you in the corridor; you get up and keep running for the daylight until the ground opens and you fall under a ton of rubble. THE END","w":870},"12":{"p":null,"e":[[140,"choice","If you refuse to go"],[127,"choice","If you go quietly"]],"en":null,"s":"Posing as songwriter River Songbird, you try to convince Flashpin Kadark, a purple member of Jasmarna's staff, to let you collaborate, but she says Jasmarna only performs her own material. When you refuse to leave, Flashpin inflates to three times her size and physically throws you out.","w":1017},"13":{"p":null,"e":[[176,"forced",""]],"en":null,"s":"Shot in the stomach, you watch the surgical crew fail to stop a Cyberman. It declares you will cease function imminently, straps you to a gurney in a room of conversion suits and begins upgrading you to help convert the settlement; a flood of cold, logical relief washes over you before pain wipes it away.","w":1687},"14":{"p":null,"e":[[102,"choice","If you give yourself a spray of glamour perfume and break out of your cell"],[74,"choice","If you conserve your supplies but break out anyway"],[82,"choice","If you decide to stay in your cell until you’ve recovered fully"]],"en":null,"s":"Still shaky but able to move, you consider your secret cell supplies: laser-function eyebrow tweezers, and a nearly empty bottle of glamour perfume that makes observers fail to register you rather than truly invisibly.","w":554},"15":{"p":null,"e":[[86,"forced",""]],"en":null,"s":"You run, knowing Silex's people need you alive, but a violet-eyed youngster with cybernetic parts trips you. Silex and two cloaked women crowd around touching you, amazed that you feel alive, 'like vitrons but better'; when Silex touches your cheek your strength drains away until he cries out that it is too much and they need you.","w":1330},"16":{"p":null,"e":[],"en":"death","s":"You stop Hennessey from following the Doctor into the jungle, suggesting they find Steven and Sara of the SSS instead. Hennessey heads the other way through the apparently abandoned undergrowth - straight into a Dalek, which exterminates him and you. THE END","w":928},"17":{"p":null,"e":[[80,"choice","If you decide to break into his cell"],[9,"choice","If you question him further"]],"en":null,"s":"The prisoner won't let you fetch a guard and leans weakly on the bars, looking seriously ill. He is probably dangerous and no one would miss him, but Stormcage is boring and the break in routine intrigues you.","w":484},"18":{"p":null,"e":[[90,"forced",""]],"en":null,"s":"With pinpoint timing you fire the tweezers and your laser collides with the gunman's, ricocheting his shot away from you and hitting someone else, who shrieks and drops; inhuman cries follow. The effort overwhelms you and you pass out.","w":590},"19":{"p":null,"e":[[92,"forced",""]],"en":null,"s":"Trade banter with the Boy about the botched Stormcage assault, until he states that his people must protect Silex's investment and cannot let you escape. You turn to run and take an energy bolt in the back, losing consciousness.","w":932},"20":{"p":null,"e":[[33,"choice","If you try breaking in"],[63,"choice","If you’d rather try to find the dancers’ dressing rooms"]],"en":null,"s":"Not ready to confront Jasmarna, you charm your way past Flashpin and roam the backstage corridors past crowds of teleporting fans. An opulent red corridor leads to a locked oak door marked MARLEY WINNERMAN.","w":1023},"21":{"p":null,"e":[[70,"choice","If you leave Tomax behind"],[160,"choice","If you attempt to save him"]],"en":null,"s":"You knock out guard Tomax with a Venusian karate chop and steal his protective gear before lockdown, then realise he will be caught in the lethal energy field with nowhere to lock him in. Only seconds remain: leave him behind, or attempt a risky rescue that may hurt you too.","w":902},"22":{"p":null,"e":[[158,"choice","If you attempt dematerialisation"],[136,"choice","If you activate the shields"]],"en":null,"s":"You set the captured Dalek time vessel for Earth's Central City and materialise near the Moon to send Hennessey an SSS signal about 'core matters'. Bringing a Dalek warship into Earth space triggers every defence system, and missiles streak toward you.","w":819},"23":{"p":null,"e":[[83,"choice","If you decide to leave well alone and return to your cell"],[46,"choice","If you decide to go to isolation and confront Navern"]],"en":null,"s":"Sneaking into the administration wing, you recover your confiscated vortex manipulator and decrypt the arrivals data on an official datapad. The new prisoner is Arun Navern, the man who pressed a button and killed millions, including your friend Fenister; you once saw the cold, empty grey eyes of the young man he was. You decide whether to return quietly to your cell or go to isolation and confront him.","w":2065},"24":{"p":null,"e":[[7,"forced",""]],"en":null,"s":"You tap 0-2-4 into the keypad. The double doors open without a sound.","w":107},"25":{"p":null,"e":[],"en":"death","s":"The left path takes you back through the refinery to where you first found Matter, and you remember the roof there was already weakened by time instability. As Matter's bad luck plays out, the roof collapses and crushes you. THE END","w":463},"26":{"p":null,"e":[[38,"choice","If you try to make a break for it"],[82,"choice","If you allow them to lock you back up"]],"en":null,"s":"You break cover and warn a guard station that something is wrong with the new prisoner; two guards head for isolation while the others escort you, annoyed, back to your cell. Guard Keisa roughly removes all your gear. You can let them lock you back up or make a break for it now.","w":832},"27":{"p":null,"e":[[100,"choice","If you try to use the vortex manipulator"],[179,"choice","If you decide not to risk it"]],"en":null,"s":"You pick the complex lock of Navern's isolation cell and enter; he touches you and drains your strength into himself, then frees himself, takes your tweezers and pulls the fake molar that cuts the power. With your vortex manipulator potentially working in a powerless Stormcage, you weigh using it against the risk Navern notices and takes it as guards approach.","w":4852},"28":{"p":null,"e":[[53,"choice","To go on the offensive"],[113,"choice","To turn and run"]],"en":null,"s":"The vortex manipulator hurls you through the conflux to a grim, metallic scrap-town under unfamiliar stars, where hooded people move without energy and the violet-eyed Boy hands out food bars. He spots you and flees through salvage corridors to a ledge, then signals two hulking cloaked figures with wrist weapons - Cybermen. He orders you taken to Control.","w":3505},"29":{"p":null,"e":[[55,"forced",""]],"en":null,"s":"Silex says he needs you to save his entire people, but you refuse to take responsibility for them and he stops trying to persuade you. He orders his men to bring you to a waiting ship. A hypodermic presses your neck and, despite your struggles, everything goes dark.","w":1189},"30":{"p":null,"e":[[11,"choice","Will you run for the exit?"],[78,"choice","Will you try to find the Cyberman?"]],"en":null,"s":"You fire past the Boy's head and demand he stop whatever is starting, but he says nothing can stop it now and raises his arms like a prayer. The Cyberman announces a subterranean class-seven launch craft hidden below, meant to carry his people to another facility; its engines roar and the roof begins to fall in. You can run for the exit or try to reach the Cyberman.","w":1205},"31":{"p":null,"e":[],"en":"death","s":"You white out and wake in a featureless room beside the dead body of Marley Winnerman. Flashpin appears at the food grille, says Jasmarna is too busy to meet you, and tosses in a capsule of nerve gas. You die on Winnerman's body. THE END","w":912},"32":{"p":null,"e":[[95,"choice","If you return to your cell"],[100,"choice","If you use the vortex manipulator"]],"en":null,"s":"Navern uses the fake molar to cut the power to Stormcage and mumbles one word, 'Tgalin' - the Dalek-occupied world destroyed in the Time War whose people needed vitron particles to survive, which should mean no survivors. You can head back to your cell, or try your vortex manipulator now that the power may be down.","w":1847},"33":{"p":null,"e":[[143,"choice","If you want to go on exploring the office"],[63,"choice","If you’d rather head for the dancers’ dressing rooms"]],"en":null,"s":"Inside Winnerman's office you find printouts mapping the stadium's erratic, colossal course across multiple star systems, flown on Jasmarna's instructions with no neighbouring-world logic. Whatever Jasmarna is building with this tour is beyond you. You can keep exploring the office or head for the dancers' dressing rooms.","w":909},"34":{"p":"Timing is everything:","e":[[13,"date","If today is a weekday as you read this"],[71,"date","If today is a weekend as you read this"]],"en":null,"s":"You let the cloaked Cyberman lead a non-lethal raid into the workshop, ordering it not to kill because you want information. It shoots down the two guards, but the second guard's weapon discharges and you feel a searing pain. Timing is everything: if today is a weekday as you read this, go one way; if it is a weekend, the other.","w":977},"35":{"p":null,"e":[[157,"choice","If you want to head for the city"],[182,"choice","If you want to find something there that might help"]],"en":null,"s":"You pass a shrivelled, apparently dead Varga plant and overhear Steven and Sara Kingdom planning to reach the Dalek city, where Mavic Chen has returned with taranium. Hennessey argues they could steal the time destructor and replace it a second later, but you know changing history means 5,000 angry Daleks; still, the weapon is the best chance against Silex. You can head for the city or look for something useful where you are.","w":2674},"36":{"p":null,"e":[],"en":"bad","s":"The tomb's psych-tech security system floods you with possessive rage, convincing you the dig site is yours to defend from the Goblin thief Matter. You throw a rock at the unstable tunnel ceiling over her and watch a temporal rift swallow her. Days later a security squad ignores your protests and drags you away to the prison world Desperus. THE END","w":1392},"37":{"p":null,"e":[[81,"choice","If you want to know how he’s worked that"],[6,"choice","If you couldn’t care less"]],"en":null,"s":"Your captor introduces himself as Silex, the one being who was off Tgalin when the Time War destroyed it. You remember the Tgaline need high concentrations of vitron particles to survive, yet both you and Silex are breathing the ordinary air here quite freely - and you wonder how he manages that.","w":1422},"38":{"p":null,"e":[[82,"forced",""]],"en":null,"s":"You kick a guard and make a break for it, but bounce straight off a forcefield as an alarm sounds. The guards recapture you, scoffing at where you thought you could go, and march you resignedly back to your cell.","w":338},"39":{"p":null,"e":[[48,"choice","To stay in the dressing room"],[20,"choice","If you’d rather snoop around elsewhere"]],"en":null,"s":"Posing as venue owner Marley Winnerman, you pump the tripping Flashpin for information: Jasmarna is on performance 121 of 136, the stadium flies an erratic, fuel-wasting course to align stars and planets to her demands, and Winnerman resisted. Jasmarna finishes her set and is about to return to the dressing room. You can stay and face her or sneak off elsewhere.","w":1751},"40":{"p":null,"e":[[131,"choice","Will you try to leave?"],[68,"choice","Will you try to help the people?"]],"en":null,"s":"You recognise the egg-shaped device as the Boy's neutronic pulse activator and deliberately switch it on, then toss it away. The pulse knocks out every piece of active cybernetic technology in the place: the Cyberman and the Boy scream, and a chorus of the cyber-enhanced rises as you realise you may have just doomed everyone here.","w":1244},"41":{"p":null,"e":[],"en":"bad","s":"You run but find only solid stone: you have blundered into a trap in the ancient citadel. Delusional, you become convinced you are a noble quester reuniting with tavern friends, still smiling fondly when the security teams arrive to take you to Desperus. THE END","w":901},"42":{"p":null,"e":[[133,"choice","If you try to run"],[32,"choice","If you stay where you are"]],"en":null,"s":"You confront the prisoner with your deductions: his eyes are violet, not the grey of Arun Navern, so he hijacked Navern's massacre as cover to get himself sent to top-security Stormcage. He gives the faintest nod and confirms the fake tooth is his way out, then squeezes it.","w":1941},"43":{"p":null,"e":[[180,"choice","If so"],[161,"choice","If you didn’t"]],"en":null,"s":"You play innocent with the Boy, claiming your manipulator broke in transit, and probe him about his age-rolled-back body and the implants stabilising him and his cultists. As you offer to become an asset, a bolt of blue fire strikes down the Boy and every one of his violet-eyed brethren, and a Cyberman marches up ordering you not to resist as you flip open your manipulator.","w":1695},"44":{"p":null,"e":[[50,"choice","If you’re willing to follow Matter to the main lab"],[36,"choice","If you don’t trust the Goblin"]],"en":null,"s":"To learn where the taranium is, you painfully burst the slow-time bubble holding the frozen Goblin, enduring a rush of pure time that leaves you nauseated and out of sync. She introduces herself as Matter, a Goblin scientist who spiced her thieving with taranium, betrayed Denton and got trapped when her own bad luck collapsed the tunnel; she suggests the two of you ambush Denton in the main lab.","w":4190},"45":{"p":null,"e":[[155,"choice","Will you exit stage right?"],[51,"choice","Will you exit stage left?"]],"en":null,"s":"On stage, Hennessey forces Jasmarna to admit her microphone rig energises vitrons into the crowd for euphoria; her detector then reveals your body is saturated with far greater compatible energies. Jasmarna reveals Silex plans to repopulate lost Tgalin with a loyal new civilisation through the conflux, and as she begins to sing again Hennessey destroys the scanner and pulls you away to escape.","w":2474},"46":{"p":null,"e":[[85,"choice","If you reach through the bars to help him"],[26,"choice","If you go to fetch help from the guards"],[83,"choice","If you wash your hands of the situation and sneak back to your cell"]],"en":null,"s":"You reach the isolation block without setting a record and find Navern collapsed on the floor in his sensory hood, barely breathing. Instinct says help him, but he is a mass murderer and you are somewhere you should never be: reach through the bars, fetch the guards, or wash your hands and sneak back.","w":894},"47":{"p":null,"e":[],"en":"death","s":"Captured and tied, you goad Silex into investigating a nearby dimension alone by pretending to resist the idea. You aim him at the messiest dimension you can sense and he vanishes, dying so fast that his violet-eyed followers' faces begin to decompose. You free yourself, but your cramped legs give out among the disintegrating Tgaline before you can escape. THE END","w":2206},"48":{"p":null,"e":[[134,"choice","If you try to find the stadium’s management"],[63,"choice","If you’d rather try to find the dancers’ dressing rooms"]],"en":null,"s":"Aware Jasmarna may recognise you from the breakout, you agree to risk a one-to-one meeting and send Flashpin to prep her. Swiping the monitor, you find the dancers calmly removing violet-eyed contacts at workstations and Flashpin activating two dormant security bots. Time to leave: find the stadium's management, or the dancers' dressing rooms.","w":1532},"49":{"p":null,"e":[],"en":"bad","s":"An electric charge kills the violet-eyed man and your strength returns; with his last words he says he only wanted to save his planet. You slip back to your cell and spray off the glamour, lying innocently as alarms go off, but events already set in motion mean that for you and the galaxy, tomorrow never comes. THE END","w":1335},"50":{"p":null,"e":[[41,"choice","If you want to run"],[61,"choice","If you stay to confront it"]],"en":null,"s":"In the refinery lab, Matter's sensor locates a lead safe holding a one-millionth of an emm of refined taranium, and she jolts it into ejecting a small metal cube. A ghostly replay of Denton and Matter replays through the hole in the wall, and then an orange humanoid glow forms in the room as the AI's psych system takes physical shape.","w":2381},"51":{"p":null,"e":[[152,"forced",""]],"en":null,"s":"You drag Hennessey toward a side exit, realising the half-finished 136-date tour has already weakened the whole galaxy and can only be disrupted by snipping a scintilla of space-time with a time destructor. SSS records place such a weapon on Kembel in 4000 AD. You set the vortex manipulator as Jasmarna's dancers close in.","w":2372},"52":{"p":null,"e":[],"en":"death","s":"The supposedly dead Varga plant lunges from the brambles and drives spines into your ribs and leg before Hennessey can pull you free. Knowing the stings bring sweats, homicidal rage and full mutation, you hand Hennessey the vortex manipulator and send him after the time destructor with the Doctor, left alone to await what you will become. THE END","w":1596},"53":{"p":null,"e":[[129,"choice","If you want to turn left and find a way down to the complex of boxy buildings"],[106,"choice","If you’d rather take the winding path back to the plaza"]],"en":null,"s":"You fight the two 'Cybermen' with a crowbar and discover they are violet-eyed men strapped into crude carapaces, their faces waxily distorted; they say they were taken here to be 'saved', that they are splinters who 'shall be one', but nothing more. You can head down toward the boxy building complex or take the winding path back to the plaza.","w":1668},"54":{"p":null,"e":[[175,"choice","If you want to talk to Jasmarna"],[45,"choice","If you let Hennessey take the lead"]],"en":null,"s":"Hennessey saves you from Zelna and the violet-eyed dancers and the two of you fight out together; he introduces himself as an undercover SSS agent investigating Jasmarna's galaxy-wide subliminal signals and mental manipulation. On the main stage you examine her microphone gadget together when Jasmarna herself appears, violet-eyed and covered in moving tattoos, saying she would love to know the good news you bring from the future.","w":5611},"55":{"p":"What is your reply?","e":[[6,"choice","‘My purpose is something I decide for myself. I have no interest in hearing your views on it’"],[37,"choice","‘Fine, maybe if you explain exactly what this purpose is and where I come into it, you won’t need to keep me tied up. Why don’t you start from the beginning?’"]],"en":null,"s":"You wake tied spread-eagled under a metal cap aboard a ship overlooking the same hellish maelstrom, still weak from Navern's touch. Silex arrives and says he wants you to understand your purpose and how hard his people have worked. You can refuse to hear it or invite him to explain from the beginning.","w":2058},"56":{"p":null,"e":[[123,"choice","If you can't translate the words, look for another way in"],[24,"puzzle","If you can translate the words into the correct numbers"]],"en":null,"s":"You study the grubby keypad and recall the near-forgotten words Tacsladia, sensill and vandeen from an archaeological dig: the ancient language maps words to numbers. Can you translate the words into the correct numbers? If you can't, look for another way in; if you can, enter them.","w":719},"57":{"p":null,"e":[[34,"choice","Will you agree and walk through the workshop?"],[145,"choice","Will you try to find an alternative route to the command deck?"]],"en":null,"s":"Moving with a genuine Cyberman across the conversion complex, you see crude non-regulation surgery fitting violet-eyed people with implants - a belonging rather than ownership, while the Cyberman insists all will be fully upgraded. The command deck lies beyond a guarded surgical workshop: cross it with the Cyberman, or find an alternative route.","w":3026},"58":{"p":"Which ship will you choose?","e":[[146,"choice","If you want to try the Spar"],[89,"choice","If you want to try Zephon’s ship"],[112,"choice","If you want to inspect the other vessels in the spaceport"]],"en":null,"s":"With Hennessey you overlook a Kembel spaceport full of Galactic Council delegates' ships, planning to flee the battle, wait it out and salvage the time destructor afterwards. You can try the ornate Spar of the Guardian of the Solar System, the smaller Fifth Galaxy ship of the despot Zephon, or inspect the other vessels.","w":1393},"59":{"p":null,"e":[],"en":"death","s":"You wake tied under a metal cap aboard a ship, too weak to follow Navern; tired of waiting, he pulls a lever and energy tears through you, splintering you into visions of countless Rivers living and dying across realities. Your mind flees to one last perfect moment, holding the end of the Doctor's bowtie. THE END","w":3755},"60":{"p":null,"e":[[90,"forced",""]],"en":null,"s":"Your laser triggers the alarm but keeps draining into the prisoner, who snatches the tweezers, abandons the tooth as guards arrive, and drags you up as a shield. Your spilled glamour hides you; when he moves, the guards see only him reaching for a weapon and open fire, and you feel the shots before blacking out.","w":1440},"61":{"p":null,"e":[[94,"choice","If you want to negotiate with the psych-tech system"],[73,"choice","If you want to shut down the psych-tech system and steal the taranium"]],"en":null,"s":"The pressure in your mind builds as the psych-tech system manifests a featureless humanoid avatar shimmering white and gold, radiating anger while stone spreads over the clean plascrete and visions assail you of lost relics, betrayal and a failed quest. Yet the presence feels complex, almost like a personality, which raises the question of whether you could simply communicate with it: negotiate with the system, or shut it down and steal the taranium.","w":722},"62":{"p":null,"e":[],"en":"bad","s":"You approach and hail your other self; the two of you compare notes - she arrived on a Dalek ship and knows Hennessey, while your reality has neither - but as you try to part, the Blinovitch Limitation Effect drags you back together. Your perspectives merge until you are merely her shadow, then there is only one River: the one who never visited Silex's ship, walking thirsty into the tavern. THE END","w":2334},"63":{"p":null,"e":[[54,"choice","If you shove Zelna backwards into the rack of costumes"],[162,"choice","If you turn and make for the door"]],"en":null,"s":"You bluff your way into the performers' dressing room as talent agent River Strong and meet Hennessey and the violet-eyed choreographer Zelna, who are calculating vocal frequencies and a Logopolitan coordinate bypass to move the stadium through space for the conflux. Zelna drags you into a mirrored costume closet, shows you the broken-necked corpse of stadium owner Marley Winnerman and pulls a tiny gun - while you realise the conflux dumped you into the past, and she takes your arrival as proof the plan succeeds. You can shove her backwards into the costume rack, or turn and make for the door.","w":5207},"64":{"p":null,"e":[[106,"choice","If so"],[57,"choice","If you want to go with the Cyberman to the facility"]],"en":null,"s":"You agree to work with the Cyberman, which has located a cybernetic enhancement facility north of the shantytown where raw materials are delivered by space vehicle. Disguised in bloodstained cloaks, you reach a high platform overlooking the pulsing prefab facility; while the Cyberman computes strategy, you reflect that this may be your only chance to slip away. If so, you can slip off now, or go with the Cyberman to the facility.","w":1768},"65":{"p":null,"e":[[69,"choice","Will you offer to help the Doctor on his mission?"],[16,"choice","Will you try to get help from Steven and Sara instead?"]],"en":null,"s":"You track the muttering to an old, craggy man with a cane and a power impulse compass: the Doctor, in his first incarnation, who has never met you. Hennessey identifies himself as SSS, and the Doctor reveals he has left Steven and Sara aboard his ship because his plan to find and destroy the hidden Dalek force alone is too dangerous to share. You can offer to help the Doctor on his mission, or try to get help from Steven and Sara instead.","w":1821},"66":{"p":null,"e":[],"en":"death","s":"You fetch a Dalek gun from the time craft, but Silex catches you before you can act, delighted at the dilemma of a second Professor Song. Your only winning move is to dive at your unconscious other self: contact between two Rivers plus the taranium detonates an explosion that kills both of you, and Silex and his taranium with you. THE END","w":1284},"67":{"p":null,"e":[[107,"choice","If you leave quietly"],[173,"choice","If you decide to fight"]],"en":null,"s":"The patch-wearing man introduces himself as Denton and, focusing your vision, shows you the tavern is a psych-tech illusion laid over a taranium mining base commissary: the refined mineral is temporally volatile, so captured intruders are held harmlessly until transport to Desperus. He once nearly pulled off the theft himself, knows where the taranium is stored, and directs you to his old break-in by the main entrance while a psych-tech-possessed drunk rises snarling witch-hag threats to stop you talking. You can leave quietly, or decide to fight.","w":5127},"68":{"p":null,"e":[[131,"forced",""]],"en":null,"s":"You confirm the Cyberman is dead and stagger downstairs to find all the guards dead and the Boy already on the ground, his features beginning to dissolve along with the other faces in the room. There is nothing you can do for any of these people now.","w":342},"69":{"p":null,"e":[[58,"choice","Will you listen to Hennessey’s idea?"],[101,"choice","If you prefer to choose your own course of action"]],"en":null,"s":"The Doctor refuses all help: the time destructor, powered by a full emm of taranium that burns out after one short use, is too dangerous for anyone but him to wield against the Daleks, and he bustles off into the jungle alone. Hennessey points out you must not be nearby when the destructor fires, then says he may have a way around the problem. You can listen to Hennessey's idea, or choose your own course of action.","w":2371},"70":{"p":null,"e":[],"en":"death","s":"After stealing guard Tomax's uniform, you find the prison completely without power and the corridors full of lumpy, clay-like violet-eyed figures fighting the guards. Your stolen pistol is useless without the prison's power, and when you lift your helmet to shout that you are not a guard, the figures' weapons are already aimed at you; you feel the sharp pain and fall, realising too late where pragmatism led. THE END","w":1958},"71":{"p":null,"e":[[30,"choice","Will you threaten the Boy?"],[11,"choice","Will you run the hell away from here?"]],"en":null,"s":"Your arm is burned and the Cyberman, drained battering down the circular door against a forcefield, lurches off to recharge in the projector room. Inside the security vault you disarm the Boy and confront him at gunpoint: he reveals Silex extruded his violet-eyed people from his own body and soul, the implants adapted from Cyber-tech halt their degradation, and the whole settlement is evacuating as a deep rumbling builds - which he calls the one way out of here. You can threaten the Boy, or run like hell away from here.","w":5826},"72":{"p":null,"e":[[167,"forced",""]],"en":null,"s":"You pass many dead guards on your way into the unknown, some of them decent sorts, and give yourself a spritz of the last of your glamour perfume before pressing on toward isolation.","w":344},"73":{"p":null,"e":[[88,"choice","If you know the name of a Goblin in the refinery"],[116,"choice","If you try to reason with Ristin and Caroo"]],"en":null,"s":"You force yourself to see past the stone illusion, but the avatar hurls an orc-raid fantasy at you until Denton smashes in with the tavern women Ristin and Caroo, whose blasters appear as crossbows, and shoots up the computer panels. Denton explains a private security fleet is about to launch neutronic missiles that kill organics while sparing the infrastructure, then sics the women on you when you claim the taranium cube, leaving you ducking their fire. If you know the name of a Goblin in the refinery you can call on it, or you can try to reason with Ristin and Caroo.","w":2748},"74":{"p":null,"e":[[14,"forced",""]],"en":null,"s":"You decide not to waste resources prying into the new prisoner's business and pick your cell lock with the tweezers instead, but a wave of dizziness staggers you straight into the violent guard Keisa. She shoves and manhandles you back to your cell rather than reporting you, leaving you exactly where you started within minutes.","w":1150},"75":{"p":null,"e":[],"en":"death","s":"Hennessey's seaweed-based launch makes Zephon's ship flood with caustic preservation jelly, meant to keep the diplomat secure in flight. You both slide under unable to move as the jelly rises over your faces; by the time the ship reaches the Fifth Galaxy months later, your corpses arrive perfectly preserved. THE END","w":1132},"76":{"p":null,"e":[[149,"forced",""]],"en":null,"s":"The spark from the faulty circuit has charged your vortex manipulator with just enough power to escape. You kick the gun from the Boy's hand and jump as every weapon opens fire in slow-motion shots that cannot touch you, though the conflux drags at your insides sickeningly before the journey begins to stabilise.","w":907},"77":{"p":null,"e":[[3,"choice","If you try to find the origin of the rift"],[96,"choice","If you go to Jasmarna’s concert"],[164,"choice","If you return to Stormcage as you left it"],[169,"choice","If you go to Stormcage before Silex arrived"]],"en":null,"s":"With a sense of deja vu, you fill the taranium core and slot it into the time destructor: the weapon powers up, then shuts down again, functional for one single use before the taranium burns out. Countless other Rivers may stand where you do, and whichever one closes the rift locks all realities into her future, so you must act as if you are the only one: trace the rift to its origin, go to Jasmarna's concert for the snip-in-time plan, return to Stormcage just as you left it, or go back to before Silex ever arrived.","w":2524},"78":{"p":null,"e":[[108,"choice","If you try to run from the Cyberman"],[8,"choice","If you try to shoot it"]],"en":null,"s":"Following the recharged Cyberman down through the shaking complex, you fight past half-converted violet-eyed guards and reach the launch bay as a patched-up cargo thruster lifts off under full plasma fire - too late to board, and lethal to stand near when it hits warp. The Cyberman suddenly hurls you to the ground and declares the alliance terminated. You can try to run from the Cyberman, or try to shoot it.","w":3007},"79":{"p":null,"e":[],"en":"neutral","s":"Ristin and Caroo warn you that Denton's tempting quests destroy everyone who joins them, but the psych-tech presence is already settling warm and heavy over your mind. Your idea of destroying the security system reframes itself as a glorious quest, the need for equipment becomes a plan to rob the Goblin bank, and within moments you have happily forgotten whatever urgent matter brought you here. THE END","w":2307},"80":{"p":null,"e":[[49,"choice","If you use them as a weapon"],[60,"choice","If you activate the laser function and try to set off a nearby alarm"]],"en":null,"s":"The tweezers take minutes on the complex cell lock; inside, the violet-eyed prisoner is barely conscious, his eyes filmy and dull, but when your hand touches his cheek it sticks fast and your strength drains cell by cell into him. His skin recolours and his eyes clear to shining amethyst as he gives a crocodile smile - while your other hand still grips the tweezers, which you can use as a weapon, or activate the laser function to set off a nearby alarm.","w":952},"81":{"p":null,"e":[[125,"choice","If you question him on the discrepancy"],[6,"choice","If you don’t want him to make this story any longer than it has to be"]],"en":null,"s":"Silex explains he built a vitron-density detector on dying Tgalin and developed it until it could locate vitron clusters through time itself, letting his people breathe by reaching back to the past - until the Time War destroyed and time-locked his homeworld, so he now feeds from rare vitron pockets across the galaxy. You catch a slip: he has started saying our, as if he is not the only survivor after all. You can question him on the discrepancy, or refuse to let him draw the story out any longer.","w":1873},"82":{"p":null,"e":[[55,"forced",""]],"en":null,"s":"You keep your own schedule and sleep until a crackling maelstrom outside Stormcage wakes you and the prison loses all power, a displaced-time ripple turning your stomach. Later your door opens not to a guard but to a woman who calls Here she is, Silex, followed by a violet-eyed man and his mismatched followers; before you can grab a weapon, a hypodermic presses to your neck and you black out.","w":3253},"83":{"p":null,"e":[[10,"choice","If you use the vortex manipulator"],[55,"choice","If you prefer to take your chances with the newcomers"]],"en":null,"s":"You sleep through the start of the crisis and wake to the maelstrom and total power failure, then overhear the violet-eyed intruders in your cell: the metal-connected Boy says the link with Silex was severed by his imprisonment, a tattooed woman reports the portals are opening, and they call Arun Navern nothing while declaring Silex shall be all - and then they name you as the one they require. With the prison powered down your vortex manipulator might work, though the maelstrom could scatter your atoms; you can use it, or take your chances with the newcomers.","w":3682},"84":{"p":null,"e":[],"en":"neutral","s":"You leave your unconscious self and try to steer the Dalek timeship back toward another option, but every jump deposits you in the same place, staring at the same metal-capped body wired into Silex's contraption; again and again you arrive exactly where you started, and there is no exit from the loop. THE END","w":1719},"85":{"p":null,"e":[[27,"choice","If you try to break into the cell"],[156,"choice","If you refuse to help"]],"en":null,"s":"You reach through the bars and pull off the hood, revealing a dark, handsome older man who does not look as you expected Arun Navern to look. A fresh alarm blares, his remarkable violet eyes flutter open, and he gestures weakly at his tongue before forcing out a barely audible plea for help. You can try to break into the cell, or refuse to help.","w":1709},"86":{"p":null,"e":[],"en":"death","s":"You wake far too weak to scream, hearing voices conclude that you have blinked but you are too far gone, that they drained too much and everything was for nothing. You keep screaming inside your head for the rest of your life without making a single sound. THE END","w":419},"87":{"p":null,"e":[[132,"forced",""]],"en":null,"s":"You raise the tweezers for a pinpoint deflection, trying to catch the guards' laser beam with your own, but the angle or timing is off: your shot never connects and theirs does, and you fall back.","w":290},"88":{"p":null,"e":[[25,"choice","If you turn left to go the same way you came here"],[130,"choice","If you hope for a shortcut by turning right"]],"en":null,"s":"The Goblin Matter sneaks up with a taranium sensor and identifies Denton as the one who betrayed her, then her luck-talent turns the whole room lethal: a bolt burns away Denton's eyepatch, Ristin and Caroo shoot each other dead, and under the eyepatch you find a scorched metal sphere holding the rest of the taranium. As the psych-tech recharges, Matter snatches the sphere and flees; you grab a blaster and chase her to a fork in the passage, where you can turn left the way you came, or turn right hoping for a shortcut.","w":1981},"89":{"p":null,"e":[[75,"choice","Will you steal Zephon’s ship?"],[146,"choice","Will you investigate Chen’s ship, the Spar ?"],[112,"choice","If you’d prefer to inspect other ships"]],"en":null,"s":"Zephon's ship sits like a huge algae-sheathed nautilus shell, door open to a stale salty smell; Hennessey notes that as a class-one diplomatic vessel no one would dare attack it anywhere. Inside, sea-green consoles grown from the walls glow to life, and Hennessey admits he knows enough of Zephon's languages to launch and land, if not much more. You can steal Zephon's ship, investigate Chen's ship the Spar, or inspect the other vessels instead.","w":939},"90":{"p":null,"e":[],"en":"death","s":"You wake weeks later in a medical ward, pinned to the bed by bars; an orderly tells you the break-in was repulsed, the blobby attackers melting away mid-rampage, and that the prisoner they came for, Arun Navern, was found dead. A stray thought about something to do with colour nags at you before guard Keisa arrives, announcing the breach must stay secret: she shoots the orderly point-blank and then shoots you where you lie. THE END","w":3846},"91":{"p":null,"e":[],"en":"death","s":"Matter smiles and offers to hand back Denton's taranium-filled sphere, only to toss it upward and stamp on your foot; as you crack your head against the rock wall the sphere smashes into the cavern roof, and a falling slab of stone crushes the breath out of you while she waves goodbye. What were the chances. THE END","w":702},"92":{"p":null,"e":[[81,"forced",""]],"en":null,"s":"You come round strapped to a rack-like machine under a metal cap in a laboratory overlooking the same hellish maelstrom, a loose and unstable point in time. Silex introduces himself, credits his conflux of time corridors with delivering you, and asks whether you know his homeworld Tgalin; when you answer that it was destroyed in the Time War with no survivors, he confirms he was fortunate enough to be off-world, and reminds you his people are built from vitron particles that are toxic to most other life.","w":2703},"93":{"p":null,"e":[[2,"choice","If you venture into the cave"],[184,"choice","If you decide to use the kayak"]],"en":null,"s":"The climb is easy but unsettling: at the summit the same cat-shaped cloud keeps repeating, suggesting a simulation or a taranium-induced chronic hysteresis, and descending brings you back out by the surging river, the tethered kayak under the bent olive tree, and the dark cave mouth trickling water behind you. You can venture into the cave, or take the kayak.","w":1657},"94":{"p":null,"e":[],"en":"neutral","s":"You reason with the psych-tech avatar, explaining the conflux threat, and it appears convinced, solemnly handing over the taranium containment device and wishing your quest well. It then gently suggests there is far more taranium hidden across Umbriel for brave questers to win with companions at their side, and you hurry gladly back to the commissary to begin the next quest, the real world already fading from your mind. THE END","w":2389},"95":{"p":null,"e":[[167,"choice","If you follow them"],[100,"choice","If you want to use your vortex manipulator"]],"en":null,"s":"With every prison defence down, you hide under the glamour while lumpy violet-eyed figures slaughter Tomax and at least ten other guards; their prison-powered pistols are as dead as they are. Two more dough-faced figures hurry past, and the choice is whether to trail them deeper into the prison or abandon the place with your vortex manipulator.","w":1430},"96":{"p":null,"e":[],"en":"good","s":"You burst from the Dalek ship onto Jasmarna's concert stage before thousands and announce your own act, River Song and the Destruction of Time, then fire a taranium-fuelled stream through the arena roof. A furious Jasmarna leaps through the beam and the merest touch of a fingertip ages her to dust in seconds; that one fragment removed from time breaks the conflux's causal chain, and Silex's plan fails before it ever began. You fly home to a still-invaded Stormcage with plenty of admin to hide behind, and take the long way for your reward - THE END, congratulations, your mission is complete.","w":2600},"97":{"p":null,"e":[[114,"forced",""]],"en":null,"s":"You try to slip around the slow-time bubble rather than rescue the Goblin, but debris drops in time with every step and the world shivers; an instant later she is on you, screaming that she saw you leave her. You swing her into what looks like a stone wall but is really a control panel, and she bolts electric blue and runs off, leaving behind a wand-like directional tracer etched with a white crystal - a taranium sensor, which you pocket.","w":1240},"98":{"p":null,"e":[[183,"forced",""]],"en":null,"s":"You blur back into existence on the Boy's planet, metres from the very Cyberman you ran out on. It fires before you can react, heat filling your stomach as you sink down and the dark closes in to the words You shall be like us.","w":444},"99":{"p":"Who will you go after first?","e":[[28,"choice","The Boy?"],[149,"choice","The Woman?"]],"en":null,"s":"The TARDIS materialises around you mid-fracture - an unfamiliar wedding-cake control room - and a beautiful future Doctor who knows you well shouts that the ship has six minutes before the portal tears her apart. You share your memories through the telepathic circuits, fixing coordinates for the tattooed woman and the metal-faced boy; the Doctor insists he must stay trapped in the fracture so that undoing events means he never arrived, and charges your manipulator with two pulsing destinations. You must choose who to go after first: the Boy, or the Woman.","w":4955},"100":{"p":null,"e":[],"en":"death","s":"The vortex spits you out almost immediately onto the hull of a ship moored beneath Stormcage, directly above the crackling maelstrom. Your vortex manipulator is dragged helplessly toward it, and with no strength to resist, your atoms are torn apart among a million simultaneous lives. THE END","w":1279},"101":{"p":null,"e":[[182,"forced",""]],"en":null,"s":"You tell Hennessey your idea: shelter in the Doctor's TARDIS, a port in any storm. The Doctor's power impulse compass showed he had just come from bearing 627, and Hennessey - a former stellar guide himself - completes your old stellar-guide calculation and points east.","w":530},"102":{"p":null,"e":[[23,"choice","If you head to the administration wing to find out more about the new prisoner"],[170,"choice","If you head to isolation to see the new prisoner first hand"]],"en":null,"s":"The tweezers spring your cell and a spritz of glamour makes you unmemorable to the guards, long enough to cross the prison and back. Out of the cell block, you must choose: head to the administration wing to learn more about the new prisoner, or go straight to isolation to see him first hand.","w":331},"103":{"p":null,"e":[[26,"choice","If you go to get help"],[17,"choice","If you stay with him"]],"en":null,"s":"After the prisoner works free of his manacles, you offer him a truffle from the chocolate box; he bites down, then goes grey and muddy, staggering in what looks at first like a fake poisoning ruse until his face starts genuinely collapsing. You can go to get help, or stay with him.","w":1396},"104":{"p":null,"e":[[76,"choice","If so"],[117,"choice","If you didn’t"]],"en":null,"s":"You thank the Boy for breaking you out of Stormcage along with Silex; he reveals only hours have passed for you but decades for him, that the galaxy's collapse took hundreds of carefully managed years, and that the conflux was deliberately created to channel energy between Silex and his people. He then announces it is time you went back to Stormcage, and your hand flies to your vortex manipulator - if it has the charge to fire, or if it does not.","w":1547},"105":{"p":null,"e":[[47,"choice","If you stick with your original plan"],[144,"choice","If you decide tinkering with the fabric of time might be the way to go"]],"en":null,"s":"You goad Silex into ordering you to find a surviving Tgalin among the dimensions, and while faking the search you genuinely sense other realities and absorb another River's plan: the conflux could be defeated by snipping a precise fragment of time out of existence and stitching the gap shut, though unmaking that stitch would unmake your own timeline too. Silex mistakes your dread for triumph and believes you have found his Tgalin. You can stick with your original plan to lure him into a lethal dimension, or commit to the plan of tinkering with the fabric of time.","w":3426},"106":{"p":"How will you answer?","e":[[19,"choice","If you say, ‘I couldn’t believe how amateurish it was. I have notes’"],[43,"choice","If you say, ‘Who is Silex?’"],[104,"choice","If you say, ‘I’m grateful, you broke me out at the same time’"]],"en":null,"s":"You return to the plaza to find the violet-eyed, implant-rigged townspeople walking in empty repeating patterns until they all turn and aim arm-weapons at you, parting for the Boy. He says he is sustaining rather than controlling them, then leans in and asks what you thought of the way they broke Silex out of Stormcage. You answer with deliberate criticism and notes, ask who Silex is, or play grateful that you were broken out at the same time.","w":1357},"107":{"p":null,"e":[[2,"choice","If you want to squeeze through the crack in the rocky outcrop"],[135,"choice","If you want to examine the entrance more closely first"],[123,"choice","If you want to search for a different way in"]],"en":null,"s":"You leave the commissary alone and, letting the illusion settle only enough to conserve energy, watch the refinery disguise itself as an ancient tomb entrance. A desiccated thief in black and red lies caught mid-crawl, overlaid by a ghostly vision of how a fast-time bubble killed him, and a thrown branch withers to dust when it crosses the threshold. Further up the hill a stony outcrop has a crack you might squeeze through, or you can examine the entrance first, or search for a different way in.","w":2138},"108":{"p":null,"e":[[149,"forced",""]],"en":null,"s":"You flee the launch bay through side corridors with the Cyberman in pursuit until a chasm blocks your path and the cargo ship's takeoff shockwave nearly throws you in. Your vortex manipulator finally chimes fully online; you step backward into the void as the Cyberman lunges, the crumbling ledge takes it after you, and its shots scatter harmlessly as the vortex pulls you away to hunt the tattooed woman in red leather.","w":1752},"109":{"p":null,"e":[],"en":"bad","s":"You run with the taranium, leaving Denton to be engulfed screaming by the psych-tech avatar, and make it back to the Dalek ship without a backward glance. The few white grains you pipette into the burnt-out core make the scorch marks fade, but there is far too little taranium: the core gleams, then melts into nothing, and your last hope of saving the universe dissolves with it. THE END","w":1392},"110":{"p":null,"e":[[92,"forced",""]],"en":null,"s":"Jasmarna stops singing, staring between you and a silver scanner in her palm: the stand you clung to has scanned you and found you saturated with vitron-compatible artron energy, exactly what they need. Hennessey lies unconscious with blood trickling from his ear; Jasmarna's tattoos pulse, her voice pierces through you, and the world fades to black.","w":1091},"111":{"p":null,"e":[],"en":"bad","s":"Bound and gagged before you can warn him that the time shafts open onto other dimensions, not merely other times, you watch Silex drain two kneeling acolytes into lumpy clay, sacrificing their vitrons so he can seed himself through the centuries. Slapped and silenced, you can only hang there and wait for a reality already ripping itself apart to finish the job. THE END","w":1712},"112":{"p":null,"e":[[5,"forced",""]],"en":null,"s":"Among the delegates' ships you find an unguarded gun-metal Dalek timeship, the only vessel with time capability, and split tasks with Hennessey: he takes your vortex manipulator back to 4100 AD Earth Central to report and source taranium - the sole active refinery is on Umbriel, easier to rob than requisition - while you jump the ship a day or two forward to recover the abandoned time destructor. After a goodbye kiss he vanishes into the glitchy, conflux-building vortex, leaving you alone aboard.","w":2803},"113":{"p":null,"e":[[129,"choice","To turn left"],[178,"choice","To turn right"]],"en":null,"s":"Two Cybermen deliberately miss and herd you through the shantytown until collapsing sheet metal drops you among crates, where shambling figures in armour that proves to be crudely bolted cages seize you; the Boy calls you too valuable to kill before a hidden attacker electrocutes his guards and sends him running. You grab a gun and chase him to a fork, where you can turn left or turn right.","w":1821},"114":{"p":null,"e":[[109,"choice","To leave here at once"],[61,"choice","To remain"]],"en":null,"s":"The stolen taranium sensor leads you to a blank wall that you force yourself through, emerging in Denton's broken-into main lab of piping and distillation columns, where you wrench a small taranium cube from a compromised suspended safe. As you take it, an orange glow coalesces into a humanoid figure and a warm pressure shoves at your mind: the psych-tech has taken physical form and now turns to face you. You can leave here at once, or remain.","w":1315},"115":{"p":null,"e":[[92,"forced",""]],"en":null,"s":"Jasmarna's song locks up your limbs, but by jerking forward in fits and starts you stagger onto a circular matter-transporter pad in an alcove, and the world dissolves gratefully before the sound can finish you off.","w":423},"116":{"p":null,"e":[],"en":"death","s":"You beg Ristin to remember her own warning about Denton and insist the crossbow she is holding is really a blaster in a psych-tech illusion designed to ship you all to Desperus; she wavers, but Caroo snaps that your filthy magics will not work and opens fire, ending your quest in the commissary. THE END","w":853},"117":{"p":null,"e":[[92,"forced",""]],"en":null,"s":"Your vortex manipulator is dead and cannot take you anywhere. A stun bolt sizzles through your chest and you collapse, left to wonder where you will wake up.","w":275},"118":{"p":null,"e":[],"en":"good","s":"It is just another boring day in Stormcage, and as you lie on your bunk planning exploits, your old friend Fenister on Beglyn 7 springs to mind; it might be time for a little breakout and a visit. THE END. Congratulations - you may never realise it, but your mission is complete, and you have saved the entire population of Beglyn 7 as well.","w":426},"119":{"p":null,"e":[],"en":"bad","s":"Your Cyber-converted self fights down the lingering human thought of the Doctor long enough to reverse the vortex manipulator and arrive in a TARDIS control room you do not recognise. The man at the console whispers River, honey through his tears, and you shoot him down and watch him begin to glow with regeneration, already raising the gun for the rest. THE END","w":1417},"120":{"p":null,"e":[[35,"choice","Do you hold very still?"],[52,"choice","Do you try to dodge past the Varga?"]],"en":null,"s":"You pull Hennessey down behind thorns and detour through the Kembel jungle away from the Daleks, following the familiar tingle of a nearby TARDIS straight into the path of a Varga plant. You can hold very still, or try to dodge past it.","w":611},"121":{"p":null,"e":[[67,"choice","If you think the man is worth talking to"],[79,"choice","If you’d rather stay with the women"]],"en":null,"s":"The glazed women introduce themselves as exiled Ristin, Countess of Zennafore, and her woman-at-arms Caroo, their memories half-eaten by this world; in trade for passage off Umbriel, Ristin whispers the words tacsladia, sensill, vandeen and says you will know their meaning when the time comes, before both women drift back into their inner daze. The eyepatch man calls over that if you want real answers you should talk to him; you can join him, or stay with the women.","w":2097},"122":{"p":null,"e":[[100,"forced",""]],"en":null,"s":"The lockdown countdown hits its final seconds with you still two corridors from your cell, so you punch the vortex manipulator in desperation. There is no lockdown and no pain: the alarm stops, the lights die, all Stormcage's power goes down, and the manipulator - still obeying your order - suddenly works.","w":1422},"123":{"p":null,"e":[[7,"forced",""]],"en":null,"s":"Time effects ripple across the tomb-facade entrance and stone begins to crumble, so you follow Denton's route around the hill to a rubble-strewn fissure blown through a plascrete corridor. Strange etched designs beg you to stop and study them until you shake off the illusion and edge carefully inside over the rubble.","w":916},"124":{"p":null,"e":[[183,"forced",""]],"en":null,"s":"When you show the Cyberman the egg-shaped device that disabled it, it crushes the gadget in its fist, declares your assistance no longer required, shoots you in the stomach and informs you that you will be upgraded as the darkness takes you.","w":631},"125":{"p":null,"e":[[150,"choice","If you want him to confirm your suspicions"],[6,"choice","If you know you’re right and don’t need him to spell it out"]],"en":null,"s":"Pressed on his slip, Silex explains that his violet-eyed followers are literally pieces of himself sent down time shafts to vitron pockets where they grow into new Tgalines whose feeding sustains him in turn, and that the conflux of shafts spanning the galaxy has taken centuries to build. He adds that you are the means to expedite it: your body holds particles compatible with vitrons but far more potent, coated in something like an essence of time. You can make him spell out his plan, or stop him there because you already know what he means.","w":1846},"126":{"p":null,"e":[],"en":"bad","s":"You insist until Silex accepts that a time lock transcends all dimensions and no version of Tgalin can ever be reached, but he rallies and declares it changes nothing: he will seed himself through every time and place anyway. His follower slaps, gags and binds you, and you wait helpless for his shafts to tear reality apart. THE END","w":1604},"127":{"p":null,"e":[[92,"forced",""]],"en":null,"s":"Thrown out by the lipstick-addled Flashpin, you turn left down the backstage corridor and walk straight into Jasmarna herself: silver-haired, violet-eyed, her skin a map of serpents and constellations under crimson leather. She knows from the entry scans that your body is saturated with artron energy and proposes a collaboration with you and Silex; when you keep backing away she opens her mouth and pours sound through your whole body until you black out at her feet.","w":1938},"128":{"p":null,"e":[[105,"choice","If you tell him you’ll look for a dimension where Tgalin exists"],[126,"choice","If you try to convince him there’s no such dimension"]],"en":null,"s":"You force out the truth: adding you to Silex's machine has opened the shafts onto competing dimensions that will annihilate each other, and even the best outcome leaves only one reality. He ignores every warning except other versions of the past, and his face fills with exultation - instead of rebuilding Tgalin, he will now hunt through the dimensions for one where it was never destroyed. You can pretend to help him look for such a dimension to buy breathing space, or keep insisting no such dimension exists.","w":2072},"129":{"p":null,"e":[[172,"choice","Do you quickly drop the packing case and press on?"],[168,"choice","Do you study the circuit board more closely?"]],"en":null,"s":"You clamber through discarded packaging toward what turns out to be a never-assembled conversion facility, its modular parts wrecked in transit. An opened case shows the foam impression of a Cyber-faceplate, with only a small silver circuit board left behind, its single green LED winking in an irregular pattern. You can drop the case and press on, or study the circuit board more closely.","w":599},"130":{"p":"Toss a coin.","e":[[91,"coin","If it comes up heads"],[138,"coin","If it comes up tails"]],"en":null,"s":"Turning right after the faint click of Goblin heels, you catch Matter outside the refinery singing a thread-spell aro
